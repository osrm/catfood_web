name: Mobile detail nutrition ingredients review

on:
  push:
    branches:
      - qa/mobile-detail-nutrition-ingredients-review-20260912

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: d7080165e1bffe4cbe93eb69f3dc2f85d90c42ae
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match deployed SHA
        run: git diff --exit-code "$TARGET_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Confirm deployed Pages path
        run: |
          curl -fsS --retry 5 --retry-delay 2 https://osrm.github.io/catfood_web/ >/tmp/catfood-live-index.html
          grep -q './assets/' /tmp/catfood-live-index.html
      - name: Run focused mobile detail review
        run: QA_FULL=1 node .github/mobile-detail-nutrition-ingredients-review.mjs
      - name: Upload review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-detail-nutrition-ingredients-review
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 90
