name: PR37 review fixes final QA

on:
  push:
    branches:
      - qa/pr37-review-fixes-final-20260915

permissions:
  contents: read

env:
  PRODUCT_SHA: 1737f1430cecacae90eeab543a6d3f1533ab6688
  BASELINE_SHA: e7da1093db7893295ce0fe6401c1e4dfd6e1495a
  QA_BASE: http://127.0.0.1:4173/catfood_web/
  BASELINE_BASE: http://127.0.0.1:4174/catfood_web/
  VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
  VITE_DECISION_INTAKE_ENABLED: 'false'

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify QA branch preserves exact product sources
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Build exact product head
        run: npm run build

      - name: Build reviewed baseline for first-fact measurement
        run: |
          git worktree add --detach /tmp/pr37-baseline "$BASELINE_SHA"
          cd /tmp/pr37-baseline
          npm ci
          npm run build

      - name: Serve candidate and reviewed baseline
        run: |
          mkdir -p qa-site-candidate/catfood_web qa-site-baseline/catfood_web
          cp -R dist/. qa-site-candidate/catfood_web/
          cp -R /tmp/pr37-baseline/dist/. qa-site-baseline/catfood_web/
          python3 -m http.server 4173 --directory qa-site-candidate >/tmp/pr37-candidate-http.log 2>&1 &
          python3 -m http.server 4174 --directory qa-site-baseline >/tmp/pr37-baseline-http.log 2>&1 &
          for port in 4173 4174; do
            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port}/catfood_web/" >/dev/null; then break; fi
              sleep 0.1
            done
            curl -fsS "http://127.0.0.1:${port}/catfood_web/" >/dev/null
          done

      - name: Validate review fixes in real Chrome
        run: node .github/pr37-review-fixes-final-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr37-review-fixes-final-qa
          path: qa-artifacts
          if-no-files-found: warn
