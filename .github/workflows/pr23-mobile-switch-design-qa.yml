name: PR23 mobile SWITCH design QA

on:
  push:
    branches:
      - qa/pr23-mobile-switch-design-20260911

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 10b0af333de2f6a0f37ae2e934c0263a37311a74
      QA_BASE: http://127.0.0.1:4173/catfood_web/
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
      VITE_DECISION_INTAKE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match PR head
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Korean font environment
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Build exact review candidate
        run: npm run build
      - name: Serve candidate under Pages base path
        run: |
          mkdir -p qa-site/catfood_web
          cp -R dist/. qa-site/catfood_web/
          python3 -m http.server 4173 --directory qa-site >/tmp/pr23-http.log 2>&1 &
          echo $! >/tmp/pr23-http.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/catfood_web/ >/dev/null; then exit 0; fi
            sleep 0.1
          done
          cat /tmp/pr23-http.log
          exit 1
      - name: Use exact interaction semantics in QA harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/pr23-mobile-switch-design-qa.mjs')
          s = p.read_text()

          start = s.index("const selected=await cdp.eval(`(()=>{const e=[...document.querySelectorAll('.switch-find-result')].find(x=>x.classList.contains('is-selected'))")
          end_marker = "result.returnCapture=await capture(cdp,prefix,'05-preview-return',['.switch-find-result.is-selected'])"
          end = s.index(end_marker, start) + len(end_marker)
          replacement = r'''const returned=await cdp.eval(`(()=>{const e=[...document.querySelectorAll('.switch-find-result')].find(x=>x.querySelector('.switch-find-result-copy strong')?.textContent.trim()===${j(lastName)});if(!e)return null;const r=e.getBoundingClientRect();return{text:e.textContent.trim(),scrollY,visible:r.bottom>0&&r.top<innerHeight,rect:[r.left,r.top,r.width,r.height]}})()`);assert.ok(returned,'same result row missing after preview close');result.returnState={beforeY,afterY:await cdp.eval('scrollY'),row:returned};result.returnCapture=await capture(cdp,prefix,'05-preview-return-position',['.switch-find-results-list']);if(!returned.visible){result.returnState.reach=await reach(cdp,lastSelector);result.returnReachedCapture=await capture(cdp,prefix,'05b-preview-return-reached',[lastSelector])}'''
          s = s[:start] + replacement + s[end:]

          flow_start = s.index('async function configureToResults(cdp){')
          flow_end = s.index('\n\nasync function progressAudit', flow_start)
          robust = r'''async function configureToResults(cdp){
  assert.equal(await cdp.eval(`(()=>{const b=document.querySelector('.switch-step-actions .switch-primary-action');if(!b||b.disabled)return false;b.click();return true})()`),true,'SKU next unavailable')
  await cdp.wait(`(()=>{const r=sessionStorage.getItem('catfood.switch-session.v1');return r&&JSON.parse(r).state.step==='change'})()`,'change step')
  await clickText(cdp,'다른 브랜드로 보기')
  await cdp.wait(`(()=>{const r=sessionStorage.getItem('catfood.switch-session.v1');return r&&JSON.parse(r).state.changeBrand===true})()`,'change brand stored')
  assert.equal(await cdp.eval(`(()=>{const b=document.querySelector('.switch-step-actions .switch-primary-action');if(!b||b.disabled)return false;b.click();return true})()`),true,'CHANGE next unavailable')
  await cdp.wait(`(()=>{const r=sessionStorage.getItem('catfood.switch-session.v1');return r&&JSON.parse(r).state.step==='keep'})()`,'keep step')
  await clickText(cdp,'건식 유지')
  await cdp.wait(`(()=>{const r=sessionStorage.getItem('catfood.switch-session.v1');return r&&JSON.parse(r).state.keep?.feedType==='건식'})()`,'dry keep stored')
  assert.equal(await cdp.eval(`(()=>{const b=document.querySelector('.switch-step-actions .switch-primary-action');if(!b||b.disabled)return false;b.click();return true})()`),true,'KEEP candidate action unavailable')
  await cdp.wait(`document.querySelector('.switch-results-stage')`,'results')
}'''
          p.write_text(s[:flow_start] + robust + s[flow_end:])
          PY
      - name: Capture and verify responsive SWITCH behavior
        run: node .github/pr23-mobile-switch-design-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr23-mobile-switch-design-qa
          path: qa-artifacts
          if-no-files-found: warn
