name: Mobile SWITCH compare React disclosure QA

on:
  push:
    branches:
      - qa/mobile-switch-compare-react-disclosure-20260916

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    env:
      PRODUCT_SHA: 459dbc65296f94519426a35447ded91db91c229e
      BASELINE_URL: https://osrm.github.io/catfood_web/
      TARGET_URL: http://127.0.0.1:4173/
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify QA branch preserves exact product sources
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused React disclosure tests
        run: node --test tests/switch-compare-overview.test.mjs

      - name: Run existing tests and production build
        run: |
          npm test
          npm run build

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Serve exact candidate build and run focused real-Chrome QA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/mobile-switch-compare-react-disclosure-qa.mjs')
          s = p.read_text()
          old = """  async eval(expression) {
              const result = await this.send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true })
              if (result.exceptionDetails) throw new Error(result.exceptionDetails.exception?.description ?? result.exceptionDetails.text)
              return result.result?.value
            }"""
          new = """  async eval(expression) {
              let result
              try {
                result = await this.send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true })
              } catch (error) {
                throw new Error(`Runtime.evaluate failed for ${expression.slice(0, 280)} :: ${error instanceof Error ? error.message : String(error)}`)
              }
              if (result.exceptionDetails) throw new Error(`${result.exceptionDetails.exception?.description ?? result.exceptionDetails.text}; expression=${expression.slice(0, 280)}`)
              return result.result?.value
            }"""
          if old not in s:
              raise SystemExit('eval helper block not found')
          s = s.replace(old, new, 1)
          s = s.replace("await this.eval('document.fonts?.ready')", "await this.eval('document.fonts?.ready.then(()=>true)')")
          p.write_text(s)
          PY
          node --check .github/mobile-switch-compare-react-disclosure-qa.mjs
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/catfood-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node .github/mobile-switch-compare-react-disclosure-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-switch-compare-react-disclosure-qa
          path: qa-artifacts
          if-no-files-found: ignore
