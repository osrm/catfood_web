name: PR23 mobile SWITCH design QA

on:
  push:
    branches:
      - qa/pr23-mobile-switch-design-20260911

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 10b0af333de2f6a0f37ae2e934c0263a37311a74
      QA_BASE: http://127.0.0.1:4173/catfood_web/
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
      VITE_DECISION_INTAKE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match PR head
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Korean font environment
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Build exact review candidate
        run: npm run build
      - name: Serve candidate under Pages base path
        run: |
          mkdir -p qa-site/catfood_web
          cp -R dist/. qa-site/catfood_web/
          python3 -m http.server 4173 --directory qa-site >/tmp/pr23-http.log 2>&1 &
          echo $! >/tmp/pr23-http.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/catfood_web/ >/dev/null; then exit 0; fi
            sleep 0.1
          done
          cat /tmp/pr23-http.log
          exit 1
      - name: Capture and verify responsive SWITCH behavior
        run: node .github/pr23-mobile-switch-design-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr23-mobile-switch-design-qa
          path: qa-artifacts
          if-no-files-found: warn
