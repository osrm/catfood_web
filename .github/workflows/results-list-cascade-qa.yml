name: Results list cascade QA

on:
  push:
    branches:
      - feat/results-list-hierarchy-20260924

permissions:
  contents: read

jobs:
  cascade:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test, typecheck and build
        run: npm test && npm run build
      - name: Start candidate server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/catfood-cascade.log 2>&1 &
          echo $! >/tmp/catfood-cascade.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/catfood-cascade.log
          exit 1
      - name: Install browser driver
        run: |
          mkdir -p /tmp/catfood-cascade
          cp qa/results-list-cascade-fix-qa.mjs /tmp/catfood-cascade/
          cd /tmp/catfood-cascade
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi
      - name: Run narrow actual candidate QA
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/results-list-cascade-output" \
          node /tmp/catfood-cascade/results-list-cascade-fix-qa.mjs
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-list-cascade
          path: results-list-cascade-output
          if-no-files-found: warn
          retention-days: 7
