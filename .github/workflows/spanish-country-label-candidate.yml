name: Spanish country label candidate check

on:
  push:
    branches:
      - qa/spanish-country-label-candidate-20260912

permissions:
  contents: read

jobs:
  candidate-qa:
    runs-on: ubuntu-latest
    env:
      PRODUCT_SHA: 1424ffd78b44f7cf2e3c163a6f910561a8e03c61
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match candidate head
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html .env.example
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Use public browser config
        run: cp .env.example .env
      - name: Existing tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Start candidate preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/catfood-preview.log 2>&1 &
          echo $! >/tmp/catfood-preview.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catfood-preview.log
          exit 1
      - name: Make QA cleanup non-fatal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/spanish-country-label-candidate.mjs')
          text = path.read_text()
          old = "c?.close(); try { proc.kill('SIGTERM') } catch {}; rmSync(dir, { recursive: true, force: true })"
          new = "c?.close(); try { proc.kill('SIGTERM') } catch {}; await sleep(250); try { rmSync(dir, { recursive: true, force: true }) } catch {}"
          if text.count(old) != 1:
              raise SystemExit('cleanup line not found exactly once')
          path.write_text(text.replace(old, new))
          PY
      - name: Focused 360px browser validation
        run: node .github/spanish-country-label-candidate.mjs
      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spanish-country-label-candidate
          path: qa-artifacts/spanish-country-label/
          if-no-files-found: error
          retention-days: 90
