name: PR22 postdeploy SWITCH QA

on:
  push:
    branches:
      - qa/pr22-postdeploy-switch-20260911

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEPLOY_SHA: 40822150b2bea4f70ef6a02ce8cb4f90a77ecdc8
      QA_BASE: https://osrm.github.io/catfood_web/
      EXPECTED_ASSET: index-CXaDmwpT.js
      SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      SUPABASE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify QA branch product sources match deployed merge
        run: git diff --exit-code "$DEPLOY_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install Korean font environment
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
      - name: Stabilize narrow browser QA timing and cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pr22-postdeploy-switch-qa.mjs')
          text = path.read_text()

          cleanup_old = "  rmSync(dir, { recursive: true, force: true })\n}"
          cleanup_new = "  try { rmSync(dir, { recursive: true, force: true }) } catch {}\n}"
          if text.count(cleanup_old) != 1:
              raise SystemExit(f'expected one cleanup call, found {text.count(cleanup_old)}')
          text = text.replace(cleanup_old, cleanup_new)

          roundtrip_old = "  await cdp.wait(`document.querySelector('.switch-results-stage')`, 'SWITCH mode roundtrip')\n  let roundtripSummary = await cdp.eval(`document.querySelector('.switch-session-bar')?.textContent.trim()`)"
          roundtrip_new = "  await cdp.wait(`document.querySelector('.switch-results-stage')`, 'SWITCH mode roundtrip')\n  await cdp.wait(`!document.querySelector('.switch-session-current')?.textContent.includes('선택한 규격 확인 중')`, 'roundtrip restored SKU label')\n  let roundtripSummary = await cdp.eval(`document.querySelector('.switch-session-bar')?.textContent.trim()`)"
          if text.count(roundtrip_old) != 1:
              raise SystemExit(f'expected one roundtrip assertion block, found {text.count(roundtrip_old)}')
          text = text.replace(roundtrip_old, roundtrip_new)

          refresh_old = "  await cdp.wait(`document.body.innerText.includes('데이터 연결됨') && document.querySelector('.switch-results-stage')`, 'refresh restored SWITCH')\n  const refreshSummary = await cdp.eval(`document.querySelector('.switch-session-bar')?.textContent.trim()`)"
          refresh_new = "  await cdp.wait(`document.body.innerText.includes('데이터 연결됨') && document.querySelector('.switch-results-stage')`, 'refresh restored SWITCH')\n  await cdp.wait(`!document.querySelector('.switch-session-current')?.textContent.includes('선택한 규격 확인 중')`, 'refresh restored SKU label')\n  const refreshSummary = await cdp.eval(`document.querySelector('.switch-session-bar')?.textContent.trim()`)"
          if text.count(refresh_old) != 1:
              raise SystemExit(f'expected one refresh assertion block, found {text.count(refresh_old)}')
          path.write_text(text.replace(refresh_old, refresh_new))
          PY
      - name: Run narrow production Pages validation
        run: node .github/pr22-postdeploy-switch-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr22-postdeploy-switch-qa
          path: qa-artifacts
          if-no-files-found: warn
