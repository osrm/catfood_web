name: PR20 Korean font layout QA

on:
  push:
    branches:
      - qa/pr20-cjk-layout-20260911

permissions:
  contents: read

jobs:
  verify-cjk-layout:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
      VITE_DECISION_INTAKE_ENABLED: 'false'
      SOURCE_SHA: 56cb7a8b234f8ed413f9f240dab941b08b24349d
      QA_BASE: http://127.0.0.1:4173/
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reuse PR19 Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          echo 'Korean font match:'
          fc-match ':lang=ko'
          echo 'Requested app fallback match:'
          fc-match 'Noto Sans KR'

      - name: Build candidate without analytics writes
        run: npm run build

      - name: Run Korean layout browser QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pr20-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl -fsS "$QA_BASE" >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS "$QA_BASE" >/dev/null
          sed -i 's/bottom.bottom <= innerHeight - 8/bottom.bottom <= height - 8/' .github/pr20-cjk-layout-qa.mjs
          node .github/pr20-cjk-layout-qa.mjs

      - name: Upload Korean layout QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr20-cjk-layout-qa
          path: qa-artifacts
          if-no-files-found: error
