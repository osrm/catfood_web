name: SWITCH keyboard Enter candidate QA

on:
  push:
    branches:
      - feat/switch-change-keep-consumer-20260926

permissions:
  contents: read

jobs:
  keyboard:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          python3 -m http.server 4173 --directory dist >/tmp/switch-keyboard.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: |
          mkdir -p /tmp/switch-keyboard
          cp qa/switch-keyboard-enter-candidate.mjs /tmp/switch-keyboard/
          cd /tmp/switch-keyboard
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          fi
      - run: node /tmp/switch-keyboard/switch-keyboard-enter-candidate.mjs
