name: Retry button candidate review

on:
  push:
    branches:
      - qa/retry-button-candidate-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    env:
      PRODUCT_SHA: e1eb0d7459f2ac6dabd5593e456bff8d72734e96
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify product sources match product head
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Configure public candidate environment
        run: cp .env.example .env.local

      - name: Run existing tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Normalize QA interception accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/retry-button-candidate-review.mjs')
          text = path.read_text()
          replacements = [
            (
              "    const hit = (this.hits.get(view) || 0) + 1\n    this.hits.set(view, hit)",
              "    const hit = request.method === 'GET' ? (this.hits.get(view) || 0) + 1 : 0\n    if (request.method === 'GET') this.hits.set(view, hit)",
            ),
            (
              "    assert.equal(finalCounts.compare_product_nutrition, 2, `detail nutrition retry count unexpected: ${JSON.stringify(finalCounts)}`)",
              "    assert.equal((finalCounts.compare_product_nutrition || 0) - (initialCounts.compare_product_nutrition || 0), 1, `detail nutrition user retry delta unexpected: initial=${JSON.stringify(initialCounts)} final=${JSON.stringify(finalCounts)}`)",
            ),
            (
              "    assert.equal(finalCounts.compare_product_ingredients, 2, `detail ingredient retry count unexpected: ${JSON.stringify(finalCounts)}`)",
              "    assert.equal((finalCounts.compare_product_ingredients || 0) - (initialCounts.compare_product_ingredients || 0), 1, `detail ingredient user retry delta unexpected: initial=${JSON.stringify(initialCounts)} final=${JSON.stringify(finalCounts)}`)",
            ),
            (
              "    assert.equal(finalCounts.compare_product_nutrition, 2, `compare nutrition retry count unexpected: ${JSON.stringify(finalCounts)}`)",
              "    assert.equal((finalCounts.compare_product_nutrition || 0) - (initialCounts.compare_product_nutrition || 0), 1, `compare nutrition user retry delta unexpected: initial=${JSON.stringify(initialCounts)} final=${JSON.stringify(finalCounts)}`)",
            ),
            (
              "    await c.wait(`document.querySelector(${js(selector)})`, 'compare keyboard retry')\n    const tab = await tabTo(c, selector);",
              "    await c.wait(`document.querySelector(${js(selector)})`, 'compare keyboard retry')\n    const initialCounts = counts(c.pausedLog)\n    const tab = await tabTo(c, selector);",
            ),
            (
              "    assert.equal(finalCounts.compare_product_nutrition, 2, `compare keyboard retry count unexpected: ${JSON.stringify(finalCounts)}`)",
              "    assert.equal((finalCounts.compare_product_nutrition || 0) - (initialCounts.compare_product_nutrition || 0), 1, `compare keyboard user retry delta unexpected: initial=${JSON.stringify(initialCounts)} final=${JSON.stringify(finalCounts)}`)",
            ),
            (
              "    return { tab, focused, focusPng, pendingCounts, finalCounts, finalState, requestLog: c.pausedLog, safety: await safety(c), exceptions: c.exceptions, consoleErrors: c.console.filter(x => x.type === 'error') }",
              "    return { initialCounts, tab, focused, focusPng, pendingCounts, finalCounts, finalState, requestLog: c.pausedLog, safety: await safety(c), exceptions: c.exceptions, consoleErrors: c.console.filter(x => x.type === 'error') }",
            ),
            (
              "    const view = 'compare_product_nutrition'; let once = false\n    c.setRule(view, () => { if (!once) { once = true; return { kind: 'fulfill', status: 503, body: { message: 'QA injected 503' }, label: 'mock_503' } } return { kind: 'continue' } })",
              "    const view = 'compare_product_nutrition'\n    c.setRule(view, () => ({ kind: 'fulfill', status: 503, body: { message: 'QA injected 503' }, label: 'mock_503' }))",
            ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected QA source not found: {old[:90]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Start localhost candidate
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/catfood-preview.log 2>&1 &
          echo $! >/tmp/catfood-preview.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/catfood-preview.log
          exit 1

      - name: Run candidate browser review
        run: node .github/retry-button-candidate-review.mjs

      - name: Upload review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-button-candidate-review
          path: qa-artifacts/retry-button-candidate/
          if-no-files-found: warn
          retention-days: 90
