name: CATFOOD browser zoom 200 review

on:
  push:
    branches:
      - qa/pr43-postdeploy-lookup-guidance-20260917

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Guard product source against reviewed main
        run: |
          git fetch origin 71104f8c322ac58c6ff45722e058c8c4bea8e0fb --depth=1
          git diff --exit-code 71104f8c322ac58c6ff45722e058c8c4bea8e0fb -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - name: Install focused browser environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk xdotool xvfb
          fc-cache -f
          Xvfb :99 -screen 0 1280x900x24 -ac >/tmp/catfood-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Adapt disclosure assertion to display-contents semantics in QA copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/zoom200-review.mjs')
          s = p.read_text()
          old = "explore200.additionalVisibleAfterOpen = await c.eval(`(()=>{const e=document.querySelector('#explore-additional-conditions');const r=e.getBoundingClientRect();return getComputedStyle(e).display!=='none'&&r.height>0})()` )".replace("` )", "`)")
          if old not in s:
              old = "explore200.additionalVisibleAfterOpen = await c.eval(`(()=>{const e=document.querySelector('#explore-additional-conditions');const r=e.getBoundingClientRect();return getComputedStyle(e).display!=='none'&&r.height>0})()` )".replace("` )", "`)")
          target = "explore200.additionalVisibleAfterOpen = await c.eval(`(()=>{const e=document.querySelector('#explore-additional-conditions');const r=e.getBoundingClientRect();return getComputedStyle(e).display!=='none'&&r.height>0})()` )".replace("` )", "`)")
          # use direct known source text if normalization above does not match
          if target not in s:
              target = "explore200.additionalVisibleAfterOpen = await c.eval(`(()=>{const e=document.querySelector('#explore-additional-conditions');const r=e.getBoundingClientRect();return getComputedStyle(e).display!=='none'&&r.height>0})()` )".replace("` )", "`)")
          s = s.replace("await browserKey('Return'); await sleep(180)\n    explore200.expandedAfter", "await browserKey('Return'); await sleep(300)\n    explore200.expandedAfter", 1)
          s = s.replace("explore200.additionalVisibleAfterOpen = await c.eval(`(()=>{const e=document.querySelector('#explore-additional-conditions');const r=e.getBoundingClientRect();return getComputedStyle(e).display!=='none'&&r.height>0})()`)", "explore200.additionalVisibleAfterOpen = await c.eval(`(()=>{const e=document.querySelector('#explore-additional-conditions');const child=e?.querySelector('.filter-section');if(!e||!child)return false;const r=child.getBoundingClientRect();return getComputedStyle(e).display==='contents'&&r.height>0&&getComputedStyle(child).display!=='none'})()`)", 1)
          p.write_text(s)
          PY
      - name: Run headed Chrome 100 to 200 percent review
        run: node .github/zoom200-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catfood-browser-zoom200-review
          path: qa-artifacts-zoom200
          if-no-files-found: ignore
