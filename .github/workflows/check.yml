name: Frontend checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  live-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/live-browser-focus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catfood-live-browser-screenshots
          path: qa-artifacts/
          if-no-files-found: warn
