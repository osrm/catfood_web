name: Live manufacturing scope QA
on:
  push:
    branches: ['qa/live-manufacturing-scope-20260927']
    paths:
      - 'qa/live-manufacturing-scope-review.mjs'
      - '.github/workflows/live-manufacturing-scope-qa.yml'
permissions:
  contents: read
jobs:
  live-manufacturing:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: f46c60a4102d79235da3ca3ece104f21e07a841f
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f46c60a4102d79235da3ca3ece104f21e07a841f
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Exact candidate production build
        run: npm run build
      - name: Install QA script and browser driver
        run: |
          mkdir -p /tmp/live-manufacturing
          curl -fsSL https://raw.githubusercontent.com/osrm/catfood_web/qa/live-manufacturing-scope-20260927/qa/live-manufacturing-scope-review.mjs -o /tmp/live-manufacturing/review.mjs
          cd /tmp/live-manufacturing
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"; else echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"; fi
      - name: Serve exact candidate
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/live-manufacturing-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/live-manufacturing-preview.log
          exit 1
      - name: Targeted live manufacturing QA
        run: OUT_DIR="$GITHUB_WORKSPACE/live-manufacturing-scope-output" node /tmp/live-manufacturing/review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-manufacturing-scope-review
          path: live-manufacturing-scope-output
          retention-days: 7
