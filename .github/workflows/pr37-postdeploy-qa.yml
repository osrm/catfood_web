name: PR37 postdeploy QA

on:
  push:
    branches:
      - qa/pr37-postdeploy-20260915

permissions:
  contents: read

env:
  MERGE_SHA: 5723ec32a5d054576734f093da1b8172087891b6

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify QA branch preserves deployed product sources
        run: git diff --exit-code "$MERGE_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Validate deployed PR37 in real Chrome
        run: node .github/pr37-postdeploy-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr37-postdeploy-qa
          path: qa-artifacts
          if-no-files-found: warn
