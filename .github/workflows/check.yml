name: Frontend checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  final-browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Korean font for visual QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=ko | head -5
      - name: Run remaining deployed browser checks
        run: node scripts/live-browser-focus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catfood-final-browser-qa
          path: qa-artifacts-final/
          if-no-files-found: warn
