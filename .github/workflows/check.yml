name: Temporary compare lazy-read patch via existing workflow

on:
  push:
    branches:
      - perf/compare-lazy-tab-reads-20261008

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Extract and apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/compare-lazy-patch-temp.yml').read_text()
          body = text.split("cat > /tmp/patch.py <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('/tmp/patch.py').write_text(body)
          PY
          python /tmp/patch.py
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/CompareView.tsx tests/switch-compare-overview.test.mjs
          git commit -m "perf: load comparison data by active tab"
          git push origin HEAD:perf/compare-lazy-tab-reads-20261008
