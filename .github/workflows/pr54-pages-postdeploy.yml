name: PR 54 Pages postdeploy QA

on:
  push:
    branches:
      - feat/results-list-hierarchy-20260924

permissions:
  contents: read

jobs:
  postdeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Confirm public Pages is reachable
        run: |
          for i in {1..30}; do
            if curl --fail --silent --location --header 'Cache-Control: no-cache' https://osrm.github.io/catfood_web/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install browser driver
        run: |
          mkdir -p /tmp/catfood-pr54-postdeploy
          cp qa/postdeploy-pr54-results.mjs /tmp/catfood-pr54-postdeploy/
          cd /tmp/catfood-pr54-postdeploy
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Run public Pages postdeploy QA
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/pr54-postdeploy-output" \
          node /tmp/catfood-pr54-postdeploy/postdeploy-pr54-results.mjs

      - name: Upload postdeploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr54-pages-postdeploy
          path: pr54-postdeploy-output
          if-no-files-found: warn
          retention-days: 7
