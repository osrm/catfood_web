name: PR32 postdeploy mode nav

on:
  push:
    branches:
      - qa/pr32-postdeploy-mode-nav-20260913

permissions:
  contents: read

jobs:
  postdeploy:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: c6f67e8798e4086da3b947a0180fb3d3657949a9
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Validate deployed 360px mode navigation
        run: node .github/pr32-postdeploy-mode-nav.mjs

      - name: Upload postdeploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr32-postdeploy-mode-nav
          path: qa-artifacts/pr32-postdeploy-mode-nav/
          if-no-files-found: error
          retention-days: 90
