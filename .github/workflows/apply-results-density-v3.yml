name: Apply Results Density Patch V3

on:
  push:
    branches:
      - 'ui/results-quickview-density-20260910'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/results-quickview-density-20260910
          fetch-depth: 0
      - name: Apply focused source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx')
          text = app.read_text()
          old = "const evaluation = mode === 'explore' ? evaluated.find((item) => item.product.product_id === product.product_id) ?? null : null; return <button data-product-id={product.product_id} className={product.product_id === selectedId ? 'research-result-card is-selected' : 'research-result-card'}"
          new = "const evaluation = mode === 'explore' ? evaluated.find((item) => item.product.product_id === product.product_id) ?? null : null; const hasExploreCriteria = mode === 'explore' && activeConditions > 0; const cardClass = ['research-result-card', product.product_id === selectedId ? 'is-selected' : '', evaluation && !hasExploreCriteria ? 'is-unfiltered' : ''].filter(Boolean).join(' '); return <button data-product-id={product.product_id} className={cardClass}"
          if old not in text: raise SystemExit('result card target not found')
          text = text.replace(old, new, 1)
          old = "{evaluation ? <RelationSummary evaluation={evaluation} /> : <span className=\"research-result-facts\">"
          new = "{evaluation ? hasExploreCriteria ? <RelationSummary evaluation={evaluation} /> : null : <span className=\"research-result-facts\">"
          if old not in text: raise SystemExit('relation target not found')
          text = text.replace(old, new, 1)
          old = "{selectedEvaluation ? <section className=\"quick-view-section\"><h2>선택한 조건과 비교</h2>"
          new = "{selectedEvaluation && activeConditions > 0 ? <section className=\"quick-view-section\"><h2>선택한 조건과 비교</h2>"
          if old not in text: raise SystemExit('quick view target not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          css = Path('src/explore-package-polish.css')
          text = css.read_text()
          marker = "@media (max-width: 980px) {"
          insert = ".research-shell.is-browsing:not(.is-inspecting) .research-result-card.is-unfiltered {\n  grid-template-columns: 74px minmax(200px, 1fr) 72px;\n}\n\n"
          if marker not in text: raise SystemExit('desktop marker not found')
          text = text.replace(marker, insert + marker, 1)
          marker = "  .research-result-card .result-relation-empty {"
          insert = "  .research-results-heading {\n    align-items: flex-start;\n    flex-direction: column;\n    gap: 4px;\n  }\n\n  .research-results-heading > div {\n    width: 100%;\n  }\n\n  .research-results-heading > div > span,\n  .research-results-context {\n    max-width: none;\n    text-align: left;\n    word-break: keep-all;\n  }\n\n"
          if marker not in text: raise SystemExit('mobile marker not found')
          text = text.replace(marker, insert + marker, 1)
          css.write_text(text)

          for path in Path('.github/workflows').glob('apply-results-density*.yml'):
              path.unlink()
          Path('.github/workflows/helper-smoke.yml').unlink(missing_ok=True)
          PY
      - name: Commit focused patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: reduce empty results density"
          git push origin HEAD:ui/results-quickview-density-20260910
