name: SWITCH CHANGE KEEP candidate QA

on:
  push:
    branches:
      - feat/switch-change-keep-ui-20260926

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reuse public Pages build configuration
        run: |
          echo "VITE_SUPABASE_URL=$(sed -n 's/^      VITE_SUPABASE_URL: //p' .github/workflows/pages.yml | head -1)" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(sed -n 's/^      VITE_SUPABASE_PUBLISHABLE_KEY: //p' .github/workflows/pages.yml | head -1)" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Test, typecheck and build candidate
        run: npm test && npm run build

      - name: Start candidate server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/switch-change-keep.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/switch-change-keep.log
          exit 1

      - name: Install browser driver
        run: |
          mkdir -p /tmp/switch-change-keep
          cp qa/switch-change-keep-candidate.mjs /tmp/switch-change-keep/
          cd /tmp/switch-change-keep
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Run actual candidate QA
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/switch-change-keep-candidate-output" \
          node /tmp/switch-change-keep/switch-change-keep-candidate.mjs

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-change-keep-candidate
          path: switch-change-keep-candidate-output
          if-no-files-found: warn
          retention-days: 7
