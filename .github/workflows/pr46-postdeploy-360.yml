name: PR46 postdeploy 360 check

on:
  push:
    branches:
      - qa/pr46-postdeploy-360-20260918

permissions:
  contents: read

env:
  PRODUCT_SHA: 4b7168298d884dd3f5f825730e74d92d220ab79c
  QA_BASE: https://osrm.github.io/catfood_web/
  VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard product sources against deployed merge
        run: |
          git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
          unexpected="$(git diff --name-only "$PRODUCT_SHA" | grep -v '^\.github/' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Korean font and report Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Check postdeploy script syntax
        run: node --check .github/pr46-postdeploy-360.mjs

      - name: Run narrow live Pages QA
        run: node .github/pr46-postdeploy-360.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr46-postdeploy-360
          path: qa-artifacts/pr46-postdeploy-360/
          if-no-files-found: error
          retention-days: 90
