name: Results Density Final PR QA

on:
  push:
    branches:
      - 'qa/results-density-pr17-final-20260910'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install and build PR candidate
        run: |
          npm ci
          npm run build
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Capture production and PR preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/catfood-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          node <<'NODE'
          import assert from 'node:assert/strict'
          import { spawn, execFileSync } from 'node:child_process'
          import { existsSync, rmSync, writeFileSync } from 'node:fs'

          const PROD='https://osrm.github.io/catfood_web/'
          const PREVIEW='http://127.0.0.1:4173/'
          const BASE_SHA='adb5a3f4022c8eea2158bf89c590bd5d9f5a3115'
          const PR_SHA='502dcf2819ae98fab6cb3ce1a497c6a2a083b6f4'
          const NONE='?view=workspace&applied=1'
          const LONG='?view=workspace&applied=1&age=adult&targets=indoor,sterilized&features=hairball,digestive,urinary,skin_coat&recipes=poultry&grainFree=1'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms))

          class Cdp {
            constructor(url){this.url=url;this.ws=null;this.id=1;this.pending=new Map()}
            async connect(){this.ws=new WebSocket(this.url);await new Promise((r,j)=>{const t=setTimeout(()=>j(new Error('ws timeout')),15000);this.ws.addEventListener('open',()=>{clearTimeout(t);r()},{once:true});this.ws.addEventListener('error',()=>j(new Error('ws error')),{once:true})});this.ws.addEventListener('message',e=>{const m=JSON.parse(e.data);if(!m.id)return;const p=this.pending.get(m.id);if(!p)return;this.pending.delete(m.id);m.error?p.j(new Error(m.error.message)):p.r(m.result)});for(const x of ['Page.enable','Runtime.enable','Network.enable'])await this.send(x)}
            send(method,params={}){const id=this.id++;return new Promise((r,j)=>{this.pending.set(id,{r,j});this.ws.send(JSON.stringify({id,method,params}))})}
            async eval(expression){const x=await this.send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(x.exceptionDetails)throw new Error(x.exceptionDetails.exception?.description||x.exceptionDetails.text);return x.result?.value}
            async wait(expression,label,ms=60000){const end=Date.now()+ms;while(Date.now()<end){try{if(await this.eval(`Boolean(${expression})`))return}catch{}await sleep(120)}throw new Error(`timeout ${label}`)}
            async nav(url){await this.send('Page.navigate',{url});await this.wait(`document.readyState==='complete'`,'ready');await this.wait(`document.querySelector('#root')&&document.body.innerText.length>0`,'root')}
            async viewport(w,h){await this.send('Emulation.setDeviceMetricsOverride',{width:w,height:h,deviceScaleFactor:1,mobile:w<800})}
            async shot(path){const data=await this.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});writeFileSync(path,Buffer.from(data.data,'base64'))}
            close(){try{this.ws?.close()}catch{}}
          }

          async function launch(){const bin='/usr/bin/google-chrome';assert.ok(existsSync(bin));const version=execFileSync(bin,['--version'],{encoding:'utf8'}).trim();const port=9980+(process.pid%10),dir=`/tmp/catfood-density-final-${process.pid}`;rmSync(dir,{recursive:true,force:true});const proc=spawn(bin,['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu',`--remote-debugging-port=${port}`,`--user-data-dir=${dir}`,'about:blank'],{stdio:'ignore'});for(let i=0;i<220;i++){try{const pages=await(await fetch(`http://127.0.0.1:${port}/json/list`)).json(),p=pages.find(x=>x.type==='page'&&x.webSocketDebuggerUrl);if(p)return{bin,version,proc,dir,c:new Cdp(p.webSocketDebuggerUrl)}}catch{}await sleep(120)}throw new Error('chrome start timeout')}

          const metric=`(()=>{const rect=n=>{if(!n)return null;const r=n.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};const cards=[...document.querySelectorAll('.research-result-card')].slice(0,5);const heading=document.querySelector('.research-results-heading'),primary=heading?.firstElementChild,context=document.querySelector('.research-results-context'),criteria=document.querySelector('.criteria-bar'),topbar=document.querySelector('.research-topbar'),nav=document.querySelector('.mode-nav'),quick=document.querySelector('.research-quick-view');return{href:location.href,innerWidth,docWidth:document.documentElement.scrollWidth,topbar:rect(topbar),nav:rect(nav),criteria:rect(criteria),heading:rect(heading),headingPrimary:rect(primary),headingContext:rect(context),headingDirection:heading?getComputedStyle(heading).flexDirection:null,headingText:(heading?.innerText||'').replace(/\\s+/g,' ').trim(),criteriaText:(criteria?.innerText||'').replace(/\\s+/g,' ').trim(),relationEmptyCount:document.querySelectorAll('.result-relation-empty').length,relationCount:document.querySelectorAll('.result-relations').length,unfilteredCount:document.querySelectorAll('.research-result-card.is-unfiltered').length,cardCount:cards.length,firstCard:rect(cards[0]),firstProductId:cards[0]?.dataset.productId||null,firstCardGrid:cards[0]?getComputedStyle(cards[0]).gridTemplateColumns:null,quick:rect(quick),quickHasComparison:[...document.querySelectorAll('.quick-view-section h2')].some(x=>x.textContent?.trim()==='선택한 조건과 비교'),quickText:(quick?.innerText||'').replace(/\\s+/g,' ').trim().slice(0,1200)}})()`

          async function waitResults(c){await c.wait(`document.querySelector('.research-results-heading')&&document.querySelectorAll('.research-result-card').length>=4`,'results');await c.wait(`document.querySelector('.research-result-image')?.complete`,'image');await sleep(450)}
          async function capture(c,env,base,w,kind,query){await c.viewport(w,w===1440?1000:844);await c.nav(base+query);await waitResults(c);const list=await c.eval(metric);assert.equal(list.docWidth,list.innerWidth,`${env}-${w}-${kind} overflow`);await c.shot(`qa-artifacts/${env}-${kind}-${w}-results.png`);const firstId=list.firstProductId;assert.ok(firstId);await c.eval(`document.querySelector('[data-product-id="${firstId}"]')?.click()`);await c.wait(`document.querySelector('.research-quick-view')`,'quick view');await sleep(220);const quick=await c.eval(metric);assert.equal(quick.docWidth,quick.innerWidth,`${env}-${w}-${kind} quick overflow`);await c.shot(`qa-artifacts/${env}-${kind}-${w}-quick.png`);return{list,quick}}

          const {bin,version,proc,dir,c}=await launch();const report={browser:bin,browserVersion:version,before:{source:'production Pages',sha:BASE_SHA,base:PROD,views:{}},after:{source:'PR local Vite preview',sha:PR_SHA,base:PREVIEW,views:{}},actions:{}}
          try {
            await c.connect()
            for(const [env,base] of [['before',PROD],['after',PREVIEW]]){
              for(const w of [360,390,1440]){
                report[env].views[`${w}-none`]=await capture(c,env,base,w,'none',NONE)
                report[env].views[`${w}-long`]=await capture(c,env,base,w,'long',LONG)
              }
            }

            for(const w of [360,390,1440]){
              const none=report.after.views[`${w}-none`],long=report.after.views[`${w}-long`]
              assert.equal(none.list.relationEmptyCount,0,`after ${w} none relation empty remains`)
              assert.equal(none.list.relationCount,0,`after ${w} none relations remain`)
              assert.ok(none.list.unfilteredCount>=4,`after ${w} none lacks unfiltered cards`)
              assert.equal(none.quick.quickHasComparison,false,`after ${w} none comparison section remains`)
              assert.equal(long.list.unfilteredCount,0,`after ${w} long marked unfiltered`)
              assert.ok(long.list.relationCount+long.list.relationEmptyCount>0,`after ${w} long lost relation`)
              assert.equal(long.quick.quickHasComparison,true,`after ${w} long comparison section missing`)
              assert.ok(long.quick.quickText.includes('확인됨')&&long.quick.quickText.includes('미확인'),`after ${w} long relation content missing`)
            }
            for(const w of [360,390]){
              const none=report.after.views[`${w}-none`],long=report.after.views[`${w}-long`]
              assert.equal(none.list.headingDirection,'column',`after ${w} none heading not stacked`)
              assert.equal(long.list.headingDirection,'column',`after ${w} long heading not stacked`)
              assert.ok(!long.list.headingContext||long.list.headingContext.y>=long.list.headingPrimary.bottom-0.5,`after ${w} context not on next line`)
              assert.ok(none.list.criteriaText.includes('추가 조건 없음'),`after ${w} top no-condition message lost`)
            }
            const grid=report.after.views['1440-none'].list.firstCardGrid||''
            report.after.desktopUnfilteredGrid=grid
            assert.equal(grid.trim().split(' ').filter(Boolean).length,3,'desktop no-condition grid still reserves relation column')

            await c.viewport(390,844);await c.nav(PREVIEW+LONG);await waitResults(c)
            const id=await c.eval(`document.querySelector('.research-result-card')?.dataset.productId`);assert.ok(id)
            await c.eval(`document.querySelector('[data-product-id="${id}"]')?.click()`);await c.wait(`document.querySelector('.research-quick-view')`,'interaction open');report.actions.opened=true
            await c.eval(`document.querySelector('.quick-view-topline button')?.click()`);await c.wait(`!document.querySelector('.research-quick-view')`,'interaction close');report.actions.closed=true
            await c.eval(`document.querySelector('[data-product-id="${id}"]')?.click()`);await c.wait(`document.querySelector('.research-quick-view')`,'interaction reopen')
            await c.eval(`[...document.querySelectorAll('.quick-view-actions button')].find(b=>b.textContent?.includes('비교에 추가'))?.click()`);await c.wait(`[...document.querySelectorAll('.quick-view-actions button')].some(b=>b.textContent?.includes('비교에서 제거'))`,'compare add');report.actions.compareAdded=true
            await c.eval(`[...document.querySelectorAll('.quick-view-actions button')].find(b=>b.textContent?.includes('비교에서 제거'))?.click()`);await c.wait(`[...document.querySelectorAll('.quick-view-actions button')].some(b=>b.textContent?.includes('비교에 추가'))`,'compare remove');report.actions.compareRemoved=true
            writeFileSync('qa-artifacts/report.json',JSON.stringify(report,null,2));console.log('RESULTS_DENSITY '+JSON.stringify(report));console.log('RESULTS_DENSITY PASS')
          } catch (error) {
            writeFileSync('qa-artifacts/report.json',JSON.stringify({...report,error:String(error)},null,2))
            throw error
          } finally {c.close();proc.kill('SIGTERM');await sleep(200);if(proc.exitCode==null)proc.kill('SIGKILL');rmSync(dir,{recursive:true,force:true})}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-density-pr17-final-qa
          path: qa-artifacts/
          if-no-files-found: error
