name: Apply mobile Results relation fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/mobile-results-relations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mobile-results-relations
      - name: Apply targeted CSS fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/explore-package-polish.css')
          text = path.read_text()
          before = '''  .research-shell.is-browsing:has(.criteria-bar) .research-workspace {
            width: calc(100% - 28px);
          }

          .research-result-packages {
            font-size: 11.5px;
          }
'''
          after = '''  .research-shell.is-browsing:has(.criteria-bar) .research-workspace {
            width: calc(100% - 28px);
          }

          .research-shell.is-browsing:not(.is-inspecting) .research-result-card:not(:has(.research-result-facts)) {
            grid-template-columns: 76px minmax(0, 1fr);
            gap: 12px;
          }

          .research-result-card .result-relation-empty {
            grid-column: 2;
          }

          .research-result-card .relation-line > strong {
            overflow: visible;
            text-overflow: clip;
            white-space: normal;
            overflow-wrap: anywhere;
          }

          .research-result-packages {
            font-size: 11.5px;
          }
'''
          if before not in text:
              raise SystemExit('target CSS block not found')
          path.write_text(text.replace(before, after, 1))
          PY
          git diff --check
          git diff -- src/explore-package-polish.css
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/explore-package-polish.css
          git commit -m "fix: keep mobile Results relations readable"
          git push origin HEAD:fix/mobile-results-relations
