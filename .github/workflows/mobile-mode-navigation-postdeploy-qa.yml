name: Mobile mode navigation postdeploy QA

on:
  push:
    branches:
      - qa/mobile-mode-navigation-postdeploy-review-final-20260912

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ff81a953ec67ae18e5f27d96b85b47109dd5ab30
      EXPECTED_CSS: index-B5TtlOCv.css
      EXPECTED_JS: index-Di2XIhiP.js
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match deployed merge
        run: git diff --exit-code "$DEPLOY_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install Korean font environment
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Run mobile mode navigation review
        run: node .github/mobile-mode-navigation-postdeploy-qa-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-mode-navigation-postdeploy-qa
          path: qa-artifacts/
          if-no-files-found: warn
