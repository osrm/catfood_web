name: Mobile Shell Header Postdeploy QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Verify deployed mobile shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          node <<'NODE'
          import assert from 'node:assert/strict'
          import { spawn, execFileSync } from 'node:child_process'
          import { existsSync, rmSync, writeFileSync } from 'node:fs'
          const BASE='https://osrm.github.io/catfood_web/'
          const SHA='adb5a3f4022c8eea2158bf89c590bd5d9f5a3115'
          const NONE=`${BASE}?view=workspace&applied=1`
          const LONG=`${BASE}?view=workspace&applied=1&age=adult&targets=indoor,sterilized&features=hairball,digestive,urinary,skin_coat&recipes=poultry&grainFree=1`
          const sleep=ms=>new Promise(r=>setTimeout(r,ms))
          class Cdp{
            constructor(url){this.url=url;this.ws=null;this.id=1;this.pending=new Map()}
            async connect(){this.ws=new WebSocket(this.url);await new Promise((r,j)=>{const t=setTimeout(()=>j(new Error('ws timeout')),15000);this.ws.addEventListener('open',()=>{clearTimeout(t);r()},{once:true});this.ws.addEventListener('error',()=>j(new Error('ws error')),{once:true})});this.ws.addEventListener('message',e=>{const m=JSON.parse(e.data);if(!m.id)return;const p=this.pending.get(m.id);if(!p)return;this.pending.delete(m.id);m.error?p.j(new Error(m.error.message)):p.r(m.result)});for(const x of ['Page.enable','Runtime.enable','Network.enable'])await this.send(x)}
            send(method,params={}){const id=this.id++;return new Promise((r,j)=>{this.pending.set(id,{r,j});this.ws.send(JSON.stringify({id,method,params}))})}
            async eval(expression){const x=await this.send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(x.exceptionDetails)throw new Error(x.exceptionDetails.exception?.description||x.exceptionDetails.text);return x.result?.value}
            async wait(expression,label,ms=60000){const end=Date.now()+ms;while(Date.now()<end){try{if(await this.eval(`Boolean(${expression})`))return}catch{}await sleep(120)}throw new Error(`timeout ${label}`)}
            async nav(url){await this.send('Page.navigate',{url});await this.wait(`document.readyState==='complete'`,'ready');await this.wait(`document.querySelector('#root')&&document.body.innerText.length>0`,'root')}
            async viewport(w,h){await this.send('Emulation.setDeviceMetricsOverride',{width:w,height:h,deviceScaleFactor:1,mobile:true})}
            async shot(path){const data=await this.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});writeFileSync(path,Buffer.from(data.data,'base64'))}
            close(){try{this.ws?.close()}catch{}}
          }
          async function launch(){const bin='/usr/bin/google-chrome';assert.ok(existsSync(bin));const version=execFileSync(bin,['--version'],{encoding:'utf8'}).trim();const port=9960+(process.pid%30),dir=`/tmp/catfood-postdeploy-shell-${process.pid}`;rmSync(dir,{recursive:true,force:true});const proc=spawn(bin,['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu',`--remote-debugging-port=${port}`,`--user-data-dir=${dir}`,'about:blank'],{stdio:'ignore'});for(let i=0;i<220;i++){try{const pages=await(await fetch(`http://127.0.0.1:${port}/json/list`)).json(),p=pages.find(x=>x.type==='page'&&x.webSocketDebuggerUrl);if(p)return{bin,version,proc,dir,c:new Cdp(p.webSocketDebuggerUrl)}}catch{}await sleep(120)}throw new Error('chrome start timeout')}
          const metric=`(()=>{const rect=n=>{if(!n)return null;const r=n.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};const info=n=>{if(!n)return null;const s=getComputedStyle(n);return{text:(n.textContent||'').trim().replace(/\\s+/g,' ').slice(0,200),rect:rect(n),position:s.position,top:s.top,zIndex:s.zIndex,display:s.display}};const overlap=(a,b)=>{if(!a||!b||a.width===0||a.height===0||b.width===0||b.height===0)return false;return Math.min(a.right,b.right)>Math.max(a.x,b.x)&&Math.min(a.bottom,b.bottom)>Math.max(a.y,b.y)};const shell=document.querySelector('.research-shell'),topbar=document.querySelector('.research-topbar'),nav=document.querySelector('.mode-nav'),criteria=document.querySelector('.criteria-bar'),card=document.querySelector('.research-result-card');const tr=rect(topbar),nr=rect(nav),cr=rect(criteria);return{href:location.href,innerWidth,scrollY,docWidth:document.documentElement.scrollWidth,font:getComputedStyle(document.body).fontFamily,shellRows:shell?getComputedStyle(shell).gridTemplateRows:null,topbar:info(topbar),modeNav:info(nav),criteriaBar:info(criteria),firstCard:info(card),topbarContainsNav:!nr||nr.width===0||nr.height===0||tr.bottom>=nr.bottom-0.5,navCriteriaOverlap:overlap(nr,cr),topbarCriteriaOverlap:overlap(tr,cr)}})()`
          function check(m,label){assert.equal(m.innerWidth,m.docWidth,`${label} horizontal overflow`);assert.ok(m.topbarContainsNav,`${label} topbar does not contain nav`);assert.equal(m.navCriteriaOverlap,false,`${label} nav criteria overlap`);assert.equal(m.topbarCriteriaOverlap,false,`${label} topbar criteria overlap`);if(m.criteriaBar)assert.ok(m.criteriaBar.rect.y>=m.topbar.rect.bottom-0.5,`${label} criteria begins inside topbar`)}
          async function waitResults(c){await c.wait(`document.querySelector('.research-topbar')&&document.querySelector('.criteria-bar')&&document.querySelectorAll('.research-result-card').length>=4`,'results');await c.wait(`document.querySelector('.research-result-image')?.complete`,'image');await sleep(450)}
          async function capture(c,w,url,label){await c.viewport(w,844);await c.nav(url);await waitResults(c);const top=await c.eval(metric);check(top,`${label} top`);await c.shot(`qa-artifacts/${label}-top.png`);await c.eval(`window.scrollTo(0,320)`);await sleep(250);const scrolled=await c.eval(metric);check(scrolled,`${label} scrolled`);await c.shot(`qa-artifacts/${label}-scrolled.png`);return{top,scrolled}}
          const {bin,version,proc,dir,c}=await launch();const report={browser:bin,browserVersion:version,deployedSha:SHA,viewports:{},actions:{}}
          try{await c.connect();for(const w of [360,390])report.viewports[w]={none:await capture(c,w,NONE,`none-${w}`),long:await capture(c,w,LONG,`long-${w}`)}
            await c.viewport(390,844);await c.nav(LONG);await waitResults(c);await c.eval(`document.querySelector('.criteria-bar > button')?.click()`);await c.wait(`document.querySelector('.condition-actions .primary-action')`,'condition edit');report.actions.conditionEdit={editorVisible:await c.eval(`Boolean(document.querySelector('.condition-actions .primary-action'))`),href:await c.eval('location.href')};assert.ok(report.actions.conditionEdit.editorVisible)
            await c.nav(NONE);await waitResults(c);await c.eval(`[...document.querySelectorAll('.mode-button')].find(b=>b.textContent?.includes('제품 찾기'))?.click()`);await c.wait(`document.querySelector('.lookup-input')`,'lookup');report.actions.menuLookup={inputVisible:await c.eval(`Boolean(document.querySelector('.lookup-input'))`),href:await c.eval('location.href')};assert.ok(report.actions.menuLookup.inputVisible)
            writeFileSync('qa-artifacts/report.json',JSON.stringify(report,null,2));console.log('POSTDEPLOY_SHELL '+JSON.stringify(report));console.log('POSTDEPLOY_SHELL PASS')
          }finally{c.close();proc.kill('SIGTERM');await sleep(200);if(proc.exitCode==null)proc.kill('SIGKILL');rmSync(dir,{recursive:true,force:true})}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-shell-header-postdeploy-qa
          path: qa-artifacts/
          if-no-files-found: error
