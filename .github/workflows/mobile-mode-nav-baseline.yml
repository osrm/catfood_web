name: Mobile mode nav baseline

on:
  push:
    branches:
      - qa/mobile-mode-nav-baseline-20260913

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          /usr/bin/google-chrome --version
      - name: Measure deployed mobile mode navigation
        run: node .github/mobile-mode-nav-baseline.mjs
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-mode-nav-baseline
          path: qa-artifacts/mobile-mode-nav-baseline/
          if-no-files-found: error
          retention-days: 30
