name: Temporary keyed compare error validation
on:
  pull_request:
    paths:
      - 'src/CompareView.tsx'
      - 'tests/switch-compare-overview.test.mjs'
      - '.github/compare-lazy-keyed-fix-temp.py'
      - '.github/workflows/manufacturing-package-scope-review.yml'
permissions:
  contents: write
jobs:
  keyed-error-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python .github/compare-lazy-keyed-fix-temp.py
      - run: npm test
      - run: npm run build
      - name: Commit focused product fix if needed
        shell: bash
        run: |
          if git diff --quiet -- src/CompareView.tsx tests/switch-compare-overview.test.mjs; then
            echo 'No product diff to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/CompareView.tsx tests/switch-compare-overview.test.mjs
          git commit -m "fix: key compare read errors to their products"
          git push origin HEAD:perf/compare-lazy-tab-reads-20261008
