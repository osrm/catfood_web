name: PR47 sticky postdeploy 360

on:
  push:
    branches:
      - qa/pr47-postdeploy-sticky-360-20260918

permissions:
  contents: read

env:
  MERGE_SHA: 22bf366d6a6cb4753afd679d2f780053c04b851d
  QA_BASE: https://osrm.github.io/catfood_web/
  VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard source against deployed merge
        run: |
          git diff --exit-code "$MERGE_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
          unexpected="$(git diff --name-only "$MERGE_SHA" | grep -v '^\.github/' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Korean font and report Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Check postdeploy script syntax
        run: node --check .github/pr47-postdeploy-sticky-360.mjs

      - name: Run live Pages sticky postdeploy
        run: node .github/pr47-postdeploy-sticky-360.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr47-postdeploy-sticky-360
          path: qa-artifacts/pr47-postdeploy-sticky-360/
          if-no-files-found: error
          retention-days: 90
