name: LOOKUP guidance exact-head checks

on:
  push:
    branches:
      - qa/pr42-postdeploy-360-20260916

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PRODUCT_SHA: 9372f37c8bbf7279ac64ab7145ea15ddd6c2ed0f
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out exact product head
        run: |
          git checkout "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
