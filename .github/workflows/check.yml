name: Frontend checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  live-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - smoke
          - desktopHistory
          - historyRace
          - hills
          - royal
          - invalidUrl
          - compareUrl
          - detailKeyboard
          - compareKeyboard
          - mobile390
          - mobile360
          - failureRetry
          - lookupHistory
    name: live-browser (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/live-browser-audit.mjs "${{ matrix.group }}"
