name: CATFOOD browser zoom 200 review

on:
  push:
    branches:
      - qa/pr43-postdeploy-lookup-guidance-20260917

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Guard product source against reviewed main
        run: |
          git fetch origin 71104f8c322ac58c6ff45722e058c8c4bea8e0fb --depth=1
          git diff --exit-code 71104f8c322ac58c6ff45722e058c8c4bea8e0fb -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - name: Install focused browser environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk xdotool xvfb
          fc-cache -f
          Xvfb :99 -screen 0 1280x900x24 -ac >/tmp/catfood-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Make disclosure timing assertion event-based in QA copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/zoom200-review.mjs')
          s = p.read_text()
          old = "await browserKey('Return'); await sleep(180)\n    explore200.expandedAfter"
          new = "await browserKey('Return'); await c.wait(`(()=>{const e=document.querySelector('#explore-additional-conditions');return e&&e.getBoundingClientRect().height>0})()`, 'EXPLORE disclosure open', 3000); await sleep(50)\n    explore200.expandedAfter"
          if old not in s:
              raise SystemExit('expected QA timing snippet not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run headed Chrome 100 to 200 percent review
        run: node .github/zoom200-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catfood-browser-zoom200-review
          path: qa-artifacts-zoom200
          if-no-files-found: ignore
