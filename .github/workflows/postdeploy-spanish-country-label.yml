name: Postdeploy Spanish country label

on:
  push:
    branches:
      - qa/postdeploy-spanish-country-label-20260913

permissions:
  contents: read

jobs:
  postdeploy-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Verify deployed Spain row at 360x844
        run: node .github/postdeploy-spanish-country-label.mjs

      - name: Upload postdeploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postdeploy-spanish-country-label
          path: qa-artifacts/postdeploy-spanish-country-label/
          if-no-files-found: error
          retention-days: 90
