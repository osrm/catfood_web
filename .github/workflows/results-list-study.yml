name: Results list study

on:
  push:
    branches:
      - qa/results-list-study-20260924

permissions:
  contents: read

jobs:
  capture-current:
    runs-on: ubuntu-latest
    env:
      MAIN_SHA: c942e0cf48068ed0ffe93fde1f3cec8df20114d3
    steps:
      - name: Checkout QA helper
        uses: actions/checkout@v5
        with:
          ref: qa/results-list-study-20260924
          persist-credentials: false

      - name: Install browser driver
        run: |
          mkdir -p /tmp/catfood-results-study
          cp qa/results-list-study.mjs /tmp/catfood-results-study/
          cd /tmp/catfood-results-study
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Capture live Pages result states
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/qa-output" node /tmp/catfood-results-study/results-list-study.mjs

      - name: Upload study evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-results-list-study
          path: qa-output
          if-no-files-found: error
          retention-days: 7
