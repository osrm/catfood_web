name: Apply PR19 mobile grid row fix

on:
  push:
    branches:
      - ui/mobile-recipe-refinement-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/mobile-recipe-refinement-20260911
      - name: Add explicit mobile shell row for refine entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/explore-package-polish.css')
          s=p.read_text()
          anchor="""  .research-shell.is-browsing:has(.criteria-bar) {
    height: auto;
    min-height: 100vh;
  }

"""
          replacement=anchor+"""  .research-shell.is-browsing:has(.criteria-bar):has(.mobile-refine-entry) {
    grid-template-rows: auto auto auto minmax(0, 1fr);
  }

"""
          if anchor not in s:
              raise SystemExit('mobile criteria shell anchor missing')
          p.write_text(s.replace(anchor,replacement,1))
          PY
          rm .github/workflows/pr19-grid-row-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/explore-package-polish.css .github/workflows/pr19-grid-row-fix.yml
          git diff --cached --check
          git commit -m "fix: size mobile refine shell rows"
          git push origin HEAD:ui/mobile-recipe-refinement-20260911
