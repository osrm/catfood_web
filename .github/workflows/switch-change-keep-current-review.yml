name: SWITCH CHANGE KEEP narrow prototype review

on:
  push:
    branches:
      - qa/switch-change-keep-review-20260926

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install browser driver
        run: |
          mkdir -p /tmp/switch-change-keep-review
          cp qa/switch-change-keep-review/render-review.mjs /tmp/switch-change-keep-review/
          cd /tmp/switch-change-keep-review
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Start local prototype server
        run: |
          python3 -m http.server 4173 --directory . >/tmp/switch-change-keep-prototype.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/qa/switch-change-keep-review/switch-change-keep-prototype.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/switch-change-keep-prototype.log
          exit 1

      - name: Run narrow responsive and keyboard QA
        run: |
          cd /tmp/switch-change-keep-review
          OUT_DIR="$GITHUB_WORKSPACE/switch-change-keep-review-output" \
          REPO_DIR="$GITHUB_WORKSPACE" \
          node render-review.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-change-keep-review-narrow
          path: switch-change-keep-review-output
          if-no-files-found: warn
          retention-days: 7
