name: PR29 detail tab scroll postdeploy

on:
  push:
    branches:
      - qa/pr29-detail-tab-scroll-postdeploy-20260912

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: b5218c85269e25a2250de88d65a15a4f27fae98c
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify product sources match deployed merge
        run: git diff --exit-code "$TARGET_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Confirm deployed Pages responds
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://osrm.github.io/catfood_web/ >/tmp/catfood-pages.html; then
              grep -Eq '(src|href)="\./assets/' /tmp/catfood-pages.html
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run narrow postdeploy browser review
        run: node .github/pr29-detail-tab-scroll-postdeploy.mjs

      - name: Upload postdeploy review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr29-detail-tab-scroll-postdeploy
          path: qa-artifacts/pr29-detail-tab-scroll-postdeploy/
          if-no-files-found: warn
          retention-days: 90
