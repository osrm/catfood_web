name: PR22 apply SWITCH session patch

on:
  push:
    branches:
      - qa/pr22-switch-session-apply-20260911

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QA helper branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply patch to product branch
        run: |
          cp .github/pr22-apply-switch-session.py /tmp/pr22-apply-switch-session.py
          git fetch origin fix/switch-session-navigation-20260911
          git checkout -B fix/switch-session-navigation-20260911 origin/fix/switch-session-navigation-20260911
          python /tmp/pr22-apply-switch-session.py

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate existing suite and production build
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit product changes
        run: |
          git config user.name osrm
          git config user.email 90407222+osrm@users.noreply.github.com
          git add src/App.tsx src/SwitchFlow.tsx src/CompareView.tsx tests/entry.ts
          git commit -m "fix: preserve SWITCH session navigation"
          git push origin HEAD:fix/switch-session-navigation-20260911
