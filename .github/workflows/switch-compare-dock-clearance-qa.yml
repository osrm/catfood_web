name: SWITCH compare dock clearance QA

on:
  push:
    branches:
      - qa/mobile-switch-compare-dock-clearance-20260916

permissions:
  contents: read

env:
  PRODUCT_SHA: 6e94c53352ffa8e5fde13ec5242abbd24a2d10e2
  BASE_SHA: b577926738955bf100e57fc179c0cfebae15824b
  BASELINE_URL: https://osrm.github.io/catfood_web/
  TARGET_URL: http://127.0.0.1:4173/catfood_web/
  VITE_DECISION_INTAKE_ENABLED: "false"

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify QA branch preserves exact product sources
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and run existing checks
        run: |
          npm ci
          npm test
          npm run build

      - name: Start candidate preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/catfood-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$TARGET_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/catfood-preview.log
          exit 1

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Run focused real-Chrome QA
        run: node .github/run-switch-compare-dock-clearance-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-compare-dock-clearance-qa
          path: qa-artifacts
          if-no-files-found: warn
