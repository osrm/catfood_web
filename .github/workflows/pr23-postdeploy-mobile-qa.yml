name: PR23 postdeploy mobile QA

on:
  push:
    branches:
      - qa/pr23-postdeploy-mobile-20260912

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MERGE_SHA: 5c3d371eaf8d54ccac9b179757ed0164072e8dbe
      EXPECTED_ASSET: index-BkMT30b9.js
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match merge SHA
        run: git diff --exit-code "$MERGE_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - name: Install Korean font environment
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Verify deployed Pages responds
        run: curl -fsS https://osrm.github.io/catfood_web/ >/dev/null
      - name: Run narrow postdeploy mobile QA
        run: node .github/pr23-postdeploy-mobile-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr23-postdeploy-mobile-qa
          path: qa-artifacts
          if-no-files-found: warn
