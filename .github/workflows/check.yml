name: Frontend checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test shard ${{ matrix.shard }}
        shell: bash
        run: |
          files=(tests/*.test.mjs)
          selected=()
          for index in "${!files[@]}"; do
            if (( index % 4 == ${{ matrix.shard }} )); then
              selected+=("${files[index]}")
            fi
          done
          if (( ${#selected[@]} > 0 )); then
            node --test --test-force-exit "${selected[@]}"
          fi

  check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
