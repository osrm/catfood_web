name: PR19 grid fix final QA

on:
  push:
    branches:
      - qa/pr19-grid-fix-final-20260911

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Test and build exact PR source
        run: npm ci && npm test && npm run build
      - name: Install Korean font
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Scope QA assertions to actual UI contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/pr19-grid-fix-final-qa.mjs')
          s = p.read_text()
          s = s.replace("assert.equal(m.activeIsSearch,true,`${label} search should own focus`);", "")
          old = "await openRefine(c);await setInput(c,'.recipe-search','');const noSearch=await measure(c);"
          new = "await openRefine(c);const initialOpen=await measure(c);assert.equal(initialOpen.activeIsSearch,true,`${w}x${h} initial open focus`);await setInput(c,'.recipe-search','');const noSearch=await measure(c);"
          if old not in s:
              raise SystemExit('initial focus anchor missing')
          s = s.replace(old, new, 1)
          old = "const oneResult=await measure(c);const oneDerived=assertOpenLayout(oneResult,`${w}x${h} one-result`);"
          new = "const oneResult=await measure(c);assert.equal(oneResult.activeIsSearch,true,`${w}x${h} search focus after query`);const oneDerived=assertOpenLayout(oneResult,`${w}x${h} one-result`);"
          if old not in s:
              raise SystemExit('query focus anchor missing')
          s = s.replace(old, new, 1)
          old = "await c.wait(`${visibleExpr('.condition-actions')}`,'condition editor');"
          new = "await c.wait(`document.querySelector('.condition-actions')`,'condition editor');"
          if old not in s:
              raise SystemExit('condition editor anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Run focused layout and interaction QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pr19-final-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          node .github/pr19-grid-fix-final-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr19-grid-fix-final-qa
          path: qa-artifacts/
          if-no-files-found: error
