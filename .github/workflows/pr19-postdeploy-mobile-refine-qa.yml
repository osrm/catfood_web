name: PR19 postdeploy mobile refine QA

on:
  push:
    branches:
      - qa/pr19-mobile-refine-overflow-20260911

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install Korean font
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run narrow production browser QA
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          node .github/pr19-postdeploy-mobile-refine-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr19-postdeploy-mobile-refine-qa
          path: qa-artifacts/
          if-no-files-found: error
