name: One-off comparable energy candidate review
on:
  pull_request:
    paths:
      - '.github/workflows/compare-energy-kcal-per-100g-review.yml'
      - 'qa/compare-energy-kcal-per-100g-review.mjs'
permissions:
  contents: read
jobs:
  candidate-browser:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
      VITE_DECISION_INTAKE_ENABLED: "false"
      PRODUCT_SHA: 78f9f411c4aee73003a9b5ce9e4f67010c7d743c
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Preserve QA source outside workspace
        run: |
          mkdir -p /tmp/compare-energy-review
          cp qa/compare-energy-kcal-per-100g-review.mjs /tmp/compare-energy-review/
      - name: Checkout exact product candidate
        uses: actions/checkout@v5
        with:
          ref: 78f9f411c4aee73003a9b5ce9e4f67010c7d743c
          clean: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build exact product candidate
        run: npm run build
      - name: Install browser driver
        run: |
          cd /tmp/compare-energy-review
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"; else echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"; fi
      - name: Serve exact product candidate
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/compare-energy-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/compare-energy-vite.log
          exit 1
      - name: Chrome comparable energy review
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/compare-energy-review-output" CANDIDATE_URL="http://127.0.0.1:4173/" PRODUCT_SHA="$PRODUCT_SHA" node /tmp/compare-energy-review/compare-energy-kcal-per-100g-review.mjs
          cp /tmp/compare-energy-review/compare-energy-kcal-per-100g-review.mjs "$GITHUB_WORKSPACE/compare-energy-review-output/validation-source.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-energy-kcal-per-100g-review
          path: compare-energy-review-output
          retention-days: 7
