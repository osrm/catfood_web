name: PR28 mobile EXPLORE condition panel QA

on:
  push:
    branches:
      - 'qa/pr28-mobile-explore-condition-panel-height-20260912'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 9fe39b04d32348b9919be6fafd2b462e4c6ec880
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
      VITE_DECISION_INTAKE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match PR head
        run: git diff --exit-code "$TARGET_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Run existing tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Serve exact candidate under Pages base path
        run: |
          mkdir -p qa-site/catfood_web
          cp -R dist/. qa-site/catfood_web/
          python3 -m http.server 4173 --directory qa-site >/tmp/pr28-http.log 2>&1 &
          echo $! >/tmp/pr28-http.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/catfood_web/ >/dev/null; then exit 0; fi
            sleep 0.1
          done
          cat /tmp/pr28-http.log
          exit 1
      - name: Run focused browser QA
        run: node .github/pr28-mobile-explore-panel-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr28-mobile-explore-condition-panel-qa
          path: qa-artifacts/
          if-no-files-found: warn
