name: PR51 live Pages postdeploy

on:
  push:
    branches:
      - qa/pr51-postdeploy-20260923

permissions:
  contents: read

jobs:
  postdeploy:
    runs-on: ubuntu-latest
    env:
      MERGE_SHA: 86730a3cae82a99b62f692833fa78f8cc39dee71
    steps:
      - name: Checkout QA helper
        uses: actions/checkout@v5
        with:
          ref: qa/pr51-postdeploy-20260923
          persist-credentials: false

      - name: Install browser driver
        run: |
          mkdir -p /tmp/catfood-pr51-postdeploy
          cp qa/pr51-postdeploy.mjs /tmp/catfood-pr51-postdeploy/
          cd /tmp/catfood-pr51-postdeploy
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Run live Pages postdeploy
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/qa-output" node /tmp/catfood-pr51-postdeploy/pr51-postdeploy.mjs

      - name: Upload postdeploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr51-live-pages-postdeploy
          path: qa-output
          if-no-files-found: error
          retention-days: 7
