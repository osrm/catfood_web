name: PR39 postdeploy mobile CHANGE QA

on:
  push:
    branches:
      - qa/pr39-postdeploy-20260916

permissions:
  contents: read

env:
  MERGE_SHA: b577926738955bf100e57fc179c0cfebae15824b
  QA_BASE: https://osrm.github.io/catfood_web/

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify QA branch preserves exact deployed product sources
        run: git diff --exit-code "$MERGE_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Validate deployed PR39 mobile CHANGE path in real Chrome
        run: node .github/pr39-postdeploy-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr39-postdeploy-qa
          path: qa-artifacts
          if-no-files-found: warn
