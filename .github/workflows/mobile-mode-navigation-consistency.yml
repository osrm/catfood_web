name: Mobile mode navigation candidate

on:
  push:
    branches:
      - qa/mobile-mode-navigation-consistency-20260913

permissions:
  contents: read

jobs:
  candidate-qa:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 29120bb559ee0198e1f99912e3780cf86657b1f6
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify product sources match candidate head
        run: git diff --exit-code "$TARGET_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html .env.example
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build candidate
        run: npm run build
      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Start candidate preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/catfood-preview.log 2>&1 &
          echo $! >/tmp/catfood-preview.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/catfood_web/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catfood-preview.log
          exit 1
      - name: Validate responsive mode navigation and state preservation
        run: node .github/mobile-mode-navigation-consistency-qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-mode-navigation-consistency
          path: qa-artifacts/mobile-mode-navigation-consistency/
          if-no-files-found: error
          retention-days: 90
