name: Desktop compare visual QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Capture current deployed compare tabs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          node <<'NODE'
          const { spawn } = require('node:child_process')
          const { existsSync, writeFileSync, rmSync } = require('node:fs')
          const BASE = 'https://osrm.github.io/catfood_web/'
          const IDS = [
            'product_b47d3ae674773585',
            'product_99c5ee4eb9211a75',
            'product_7729d5c3a145ffd6',
            'product_06cc1df5a4cec6f6',
            'product_e2df0243fd9a3e68',
          ]
          const TABS = ['overview', 'nutrition', 'ingredients']
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
          class Cdp {
            constructor(url) { this.url=url; this.ws=null; this.seq=1; this.pending=new Map() }
            async connect() {
              this.ws = new WebSocket(this.url)
              await new Promise((resolve,reject) => {
                const t=setTimeout(()=>reject(new Error('CDP websocket timeout')),15000)
                this.ws.addEventListener('open',()=>{clearTimeout(t);resolve()},{once:true})
                this.ws.addEventListener('error',()=>reject(new Error('CDP websocket error')),{once:true})
              })
              this.ws.addEventListener('message',(event)=>{
                const m=JSON.parse(event.data)
                if(!m.id) return
                const p=this.pending.get(m.id); if(!p) return
                this.pending.delete(m.id)
                m.error ? p.reject(new Error(m.error.message)) : p.resolve(m.result)
              })
              for(const method of ['Page.enable','Runtime.enable','Network.enable']) await this.send(method)
            }
            send(method,params={}) {
              const id=this.seq++
              return new Promise((resolve,reject)=>{this.pending.set(id,{resolve,reject});this.ws.send(JSON.stringify({id,method,params}))})
            }
            async eval(expression) {
              const r=await this.send('Runtime.evaluate',{expression,returnByValue:true})
              if(r.exceptionDetails) throw new Error(r.exceptionDetails.exception?.description || r.exceptionDetails.text)
              return r.result?.value
            }
            async wait(expression,label,timeout=45000) {
              const end=Date.now()+timeout
              while(Date.now()<end){try{if(await this.eval(`Boolean(${expression})`))return}catch{}await sleep(120)}
              throw new Error(`timeout ${label}`)
            }
            async screenshot(path) {
              const metrics=await this.send('Page.getLayoutMetrics')
              const height=Math.min(Math.ceil(metrics.cssContentSize?.height || metrics.contentSize?.height || 1100), 5000)
              const shot=await this.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:true,clip:{x:0,y:0,width:1440,height,scale:1}})
              writeFileSync(path,Buffer.from(shot.data,'base64'))
            }
            close(){try{this.ws?.close()}catch{}}
          }
          async function launch(){
            const binary=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(existsSync)
            if(!binary) throw new Error('Chrome/Chromium not found')
            const port=9850+(process.pid%100), profile=`/tmp/catfood-desktop-visual-${process.pid}`
            rmSync(profile,{recursive:true,force:true})
            const proc=spawn(binary,['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--no-first-run',`--remote-debugging-port=${port}`,`--user-data-dir=${profile}`,'--window-size=1440,1100','about:blank'],{stdio:'ignore'})
            const end=Date.now()+30000
            while(Date.now()<end){
              try{const pages=await(await fetch(`http://127.0.0.1:${port}/json/list`)).json();const page=pages.find(x=>x.type==='page'&&x.webSocketDebuggerUrl);if(page)return{proc,profile,binary,cdp:new Cdp(page.webSocketDebuggerUrl)}}catch{}
              await sleep(150)
            }
            throw new Error('Chrome remote debugging endpoint timeout')
          }
          const {proc,profile,binary,cdp}=await launch()
          const results=[]
          try{
            await cdp.connect()
            await cdp.send('Emulation.setDeviceMetricsOverride',{width:1440,height:1100,deviceScaleFactor:1,mobile:false})
            for(const tab of TABS){
              const url=`${BASE}?view=workspace&applied=1&compare=${IDS.join(',')}&compareOpen=1&compareTab=${tab}`
              await cdp.send('Page.navigate',{url})
              await cdp.wait(`document.readyState==='complete'`,'document ready')
              await cdp.wait(`document.querySelectorAll('.compare-product-head').length===5`,'five product heads')
              if(tab==='nutrition') await cdp.wait(`!document.querySelector('.compare-state')?.innerText.includes('영양 정보를 불러오는 중입니다.')`,'nutrition loaded')
              if(tab==='ingredients') await cdp.wait(`!document.querySelector('.compare-state')?.innerText.includes('원재료 정보를 불러오는 중입니다.') && document.querySelector('.compare-ingredient-text')`,'ingredients loaded')
              await sleep(500)
              const metrics=await cdp.eval(`(()=>{
                const rect=n=>{const r=n.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}}
                const inspect=(selector)=>[...document.querySelectorAll(selector)].map(n=>({text:n.textContent.trim().replace(/\\s+/g,' ').slice(0,220),clientWidth:n.clientWidth,scrollWidth:n.scrollWidth,clientHeight:n.clientHeight,scrollHeight:n.scrollHeight,rect:rect(n),fontSize:getComputedStyle(n).fontSize,lineHeight:getComputedStyle(n).lineHeight,overflowX:getComputedStyle(n).overflowX,overflowY:getComputedStyle(n).overflowY}))
                const wrap=document.querySelector('.compare-table-wrap')
                return {href:location.href,innerWidth,docWidth:document.documentElement.scrollWidth,fontFamily:getComputedStyle(document.body).fontFamily,wrap:{clientWidth:wrap.clientWidth,scrollWidth:wrap.scrollWidth},names:inspect('.compare-product-copy > strong'),packages:inspect('.compare-product-copy > small'),labels:inspect('.compare-row-label'),cells:inspect('.compare-cell'),sectionNotes:inspect('.compare-section-row span'),ingredientTexts:inspect('.compare-ingredient-text')}
              })()`)
              results.push({tab,...metrics})
              await cdp.screenshot(`qa-artifacts/compare-5-${tab}-1440.png`)
            }
            writeFileSync('qa-artifacts/metrics.json',JSON.stringify({browser:binary,viewport:'1440x1100',results},null,2))
            console.log(JSON.stringify({browser:binary,viewport:'1440x1100',results:results.map(r=>({tab:r.tab,fontFamily:r.fontFamily,docWidth:r.docWidth,wrap:r.wrap,names:r.names.map(n=>({text:n.text,clientWidth:n.clientWidth,scrollWidth:n.scrollWidth,clientHeight:n.clientHeight,scrollHeight:n.scrollHeight})),packages:r.packages.map(n=>({text:n.text,clientWidth:n.clientWidth,scrollWidth:n.scrollWidth})),ingredientCount:r.ingredientTexts.length}))},null,2))
          } finally {
            cdp.close(); proc.kill('SIGTERM'); await sleep(200); if(proc.exitCode==null) proc.kill('SIGKILL'); rmSync(profile,{recursive:true,force:true})
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catfood-desktop-compare-visual-1440
          path: qa-artifacts/
          if-no-files-found: error
