name: Mobile compare postdeploy QA

on:
  push:
    branches:
      - qa/mobile-compare-postdeploy-20260912

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    env:
      DEPLOY_SHA: 5c3d371eaf8d54ccac9b179757ed0164072e8dbe
      EXPECTED_ASSET: index-BkMT30b9.js
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match deploy SHA
        run: git diff --exit-code "$DEPLOY_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Verify deployed Pages responds
        run: |
          set -euo pipefail
          html="$(curl -fsS https://osrm.github.io/catfood_web/)"
          printf '%s' "$html" | grep -F "$EXPECTED_ASSET" >/dev/null
      - name: Run narrow mobile comparison QA
        run: |
          sed -i 's/\.switch-inspector h1/\.switch-candidate-inspector h1/' .github/mobile-compare-postdeploy-qa.mjs
          node .github/mobile-compare-postdeploy-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-compare-postdeploy-qa
          path: qa-artifacts/
          if-no-files-found: warn
