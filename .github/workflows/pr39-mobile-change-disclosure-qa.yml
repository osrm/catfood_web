name: PR39 mobile CHANGE disclosure QA

on:
  push:
    branches:
      - qa/pr39-mobile-change-disclosure-20260915

permissions:
  contents: read

env:
  PRODUCT_SHA: d5a29f4f1017da961deef3d1ef56ef04fce06cbb
  QA_BASE: http://127.0.0.1:4173/catfood_web/
  VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
  VITE_DECISION_INTAKE_ENABLED: 'false'

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify QA branch preserves exact product sources
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Build exact product head
        run: npm run build

      - name: Prepare QA harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pr39-mobile-change-disclosure-qa.mjs')
          text = path.read_text()
          old_viewport = "rect.bottom <= innerHeight - 8"
          if old_viewport not in text:
              raise SystemExit('viewport patch target not found')
          text = text.replace(old_viewport, 'rect.bottom <= 836', 1)
          old_keyboard = """    // Native keyboard operation: Enter closes, Space opens again.\n    await key(c, 'Enter', 'Enter', 13)\n    assert.equal(await c.eval(`document.querySelector('.switch-change-additional-toggle')?.getAttribute('aria-expanded')`), 'false')\n    await key(c, ' ', 'Space', 32)\n    assert.equal(await c.eval(`document.querySelector('.switch-change-additional-toggle')?.getAttribute('aria-expanded')`), 'true')\n"""
          new_keyboard = """    // Native keyboard operation: reach the control with Tab, then use Enter and Space.\n    for (let i = 0; i < 24; i++) {\n      if (await c.eval(`document.activeElement===document.querySelector('.switch-change-additional-toggle')`)) break\n      await key(c, 'Tab', 'Tab', 9)\n    }\n    assert.equal(await c.eval(`document.activeElement===document.querySelector('.switch-change-additional-toggle')`), true)\n    await key(c, 'Enter', 'Enter', 13)\n    assert.equal(await c.eval(`document.querySelector('.switch-change-additional-toggle')?.getAttribute('aria-expanded')`), 'false')\n    await key(c, ' ', 'Space', 32)\n    assert.equal(await c.eval(`document.querySelector('.switch-change-additional-toggle')?.getAttribute('aria-expanded')`), 'true')\n"""
          if old_keyboard not in text:
              raise SystemExit('keyboard patch target not found')
          path.write_text(text.replace(old_keyboard, new_keyboard, 1))
          PY

      - name: Serve candidate build
        run: |
          mkdir -p qa-site/catfood_web
          cp -R dist/. qa-site/catfood_web/
          python3 -m http.server 4173 --directory qa-site >/tmp/pr39-change-http.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4173/catfood_web/" >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS "http://127.0.0.1:4173/catfood_web/" >/dev/null

      - name: Validate mobile CHANGE disclosure in real Chrome
        run: node .github/pr39-mobile-change-disclosure-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr39-mobile-change-disclosure-qa
          path: qa-artifacts
          if-no-files-found: warn
