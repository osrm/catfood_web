name: Results list candidate QA

on:
  push:
    branches:
      - feat/results-list-hierarchy-20260924

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test, typecheck and build
        run: npm test && npm run build

      - name: Start candidate server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/catfood-results-list.log 2>&1 &
          echo $! >/tmp/catfood-results-list.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/catfood-results-list.log
          exit 1

      - name: Install browser driver
        run: |
          mkdir -p /tmp/catfood-results-list
          cp qa/results-list-candidate-qa.mjs /tmp/catfood-results-list/
          cd /tmp/catfood-results-list
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Run actual candidate browser QA
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/results-list-candidate-output"           node /tmp/catfood-results-list/results-list-candidate-qa.mjs

      - name: Upload actual candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-list-candidate
          path: results-list-candidate-output
          if-no-files-found: warn
          retention-days: 7
