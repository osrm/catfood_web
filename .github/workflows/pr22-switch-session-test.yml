name: PR22 SWITCH session tests

on:
  push:
    branches:
      - qa/pr22-switch-session-test-20260911

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/switch-session-navigation-20260911
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # This branch only drives validation; product changes stay on the fix branch.
