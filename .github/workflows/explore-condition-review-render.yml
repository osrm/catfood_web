name: Explore condition review render

on:
  push:
    branches:
      - qa/explore-condition-review-20260926

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Start static prototype server
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/explore-condition-prototype.log 2>&1 &
          echo $! >/tmp/explore-condition-prototype.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/qa/explore-condition-review/condition-prototype.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/explore-condition-prototype.log
          exit 1

      - name: Install browser driver
        run: |
          mkdir -p /tmp/explore-condition-review
          cp qa/explore-condition-review/render-review.mjs /tmp/explore-condition-review/
          cd /tmp/explore-condition-review
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Render current and prototype
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/explore-condition-review-output" \
          node /tmp/explore-condition-review/render-review.mjs

      - name: Copy prototype source into artifact
        run: |
          cp qa/explore-condition-review/condition-prototype.html explore-condition-review-output/
          cp qa/explore-condition-review/condition-prototype.css explore-condition-review-output/

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-condition-review
          path: explore-condition-review-output
          if-no-files-found: warn
          retention-days: 7
