name: Mobile SWITCH compare header typography QA

on:
  push:
    branches:
      - qa/mobile-switch-compare-header-typography-20260916

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 484d6d00435ec5c29285c8d9d6184460171183b0
      PRODUCT_SHA: f03c547beae2c93f76cdec5493cb9a01dbaf2358
      BASELINE_BUILD_URL: http://127.0.0.1:4174/
      TARGET_BUILD_URL: http://127.0.0.1:4173/
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
      VITE_DECISION_INTAKE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify QA branch preserves exact product sources
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install candidate dependencies
        run: npm ci

      - name: Run existing tests
        run: npm test

      - name: Typecheck and build exact candidate
        run: npm run build

      - name: Build exact baseline
        run: |
          git worktree add /tmp/catfood-baseline "$BASE_SHA"
          cd /tmp/catfood-baseline
          npm ci
          npm run build

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Serve exact builds and run deterministic layout QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/catfood-candidate.log 2>&1 &
          (cd /tmp/catfood-baseline && npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/catfood-baseline.log 2>&1) &
          for port in 4173 4174; do
            for i in {1..60}; do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done
          node .github/mobile-switch-compare-header-deterministic-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-switch-compare-header-typography-qa
          path: qa-artifacts-deterministic
          if-no-files-found: ignore
