name: Apply Results Density Patch Push

on:
  push:
    branches:
      - ui/results-quickview-density-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/results-quickview-density-20260910
          fetch-depth: 0
      - name: Apply focused source patch
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old = """    return <div className=\"research-results-list\">{visibleProducts.map((product) => { const evaluation = mode === 'explore' ? evaluated.find((item) => item.product.product_id === product.product_id) ?? null : null; return <button data-product-id={product.product_id} className={product.product_id === selectedId ? 'research-result-card is-selected' : 'research-result-card'} key={product.product_id} type=\"button\" onClick={() => openExploreProduct(product.product_id)}><ProductImage className=\"research-result-image\" product={product} /><span className=\"research-result-identity\"><span className=\"research-result-brand\">{product.brand}</span><strong>{product.canonical_name}</strong><span className=\"research-result-meta\">{product.feed_type ?? '형태 미확인'} · {product.life_stage ? optionLabel(product.life_stage, LIFE_STAGE_LABELS) : '대상 연령 미확인'}</span><span className=\"research-result-packages\">판매 규격 · {packageOptionsLabel(product)}</span></span>{evaluation ? <RelationSummary evaluation={evaluation} /> : <span className=\"research-result-facts\"><span>제품 표기 대상</span><strong>{compactList(product.official_targets, TARGET_LABELS)}</strong><span>주요 레시피</span><strong>{compactList(product.recipe_details, RECIPE_DETAIL_LABELS)}</strong></span>}<span className=\"research-result-open\">제품 보기 →</span></button> })}{visibleCount < resultProducts.length ? <button className=\"load-more\" type=\"button\" onClick={loadMore}>제품 더 보기 · {resultProducts.length - visibleProducts.length}개 남음</button> : null}</div>
"""
          new = """    return <div className=\"research-results-list\">{visibleProducts.map((product) => { const evaluation = mode === 'explore' ? evaluated.find((item) => item.product.product_id === product.product_id) ?? null : null; const hasExploreCriteria = mode === 'explore' && activeConditions > 0; const cardClass = [\"research-result-card\", product.product_id === selectedId ? \"is-selected\" : \"\", evaluation && !hasExploreCriteria ? \"is-unfiltered\" : \"\"].filter(Boolean).join(' '); return <button data-product-id={product.product_id} className={cardClass} key={product.product_id} type=\"button\" onClick={() => openExploreProduct(product.product_id)}><ProductImage className=\"research-result-image\" product={product} /><span className=\"research-result-identity\"><span className=\"research-result-brand\">{product.brand}</span><strong>{product.canonical_name}</strong><span className=\"research-result-meta\">{product.feed_type ?? '형태 미확인'} · {product.life_stage ? optionLabel(product.life_stage, LIFE_STAGE_LABELS) : '대상 연령 미확인'}</span><span className=\"research-result-packages\">판매 규격 · {packageOptionsLabel(product)}</span></span>{evaluation ? hasExploreCriteria ? <RelationSummary evaluation={evaluation} /> : null : <span className=\"research-result-facts\"><span>제품 표기 대상</span><strong>{compactList(product.official_targets, TARGET_LABELS)}</strong><span>주요 레시피</span><strong>{compactList(product.recipe_details, RECIPE_DETAIL_LABELS)}</strong></span>}<span className=\"research-result-open\">제품 보기 →</span></button> })}{visibleCount < resultProducts.length ? <button className=\"load-more\" type=\"button\" onClick={loadMore}>제품 더 보기 · {resultProducts.length - visibleProducts.length}개 남음</button> : null}</div>
"""
          if old not in text:
              raise SystemExit('result list target not found')
          text = text.replace(old, new, 1)
          old_q = '{selectedEvaluation ? <section className="quick-view-section"><h2>선택한 조건과 비교</h2>'
          new_q = '{selectedEvaluation && activeConditions > 0 ? <section className="quick-view-section"><h2>선택한 조건과 비교</h2>'
          if old_q not in text:
              raise SystemExit('quick-view target not found')
          text = text.replace(old_q, new_q, 1)
          app.write_text(text)

          css = Path('src/explore-package-polish.css')
          c = css.read_text()
          anchor = ".research-shell.is-browsing:not(.is-inspecting) .research-result-card:not(:has(.research-result-facts)) {\n  grid-template-columns: 74px minmax(200px, 1.2fr) minmax(160px, 0.7fr) 72px;\n  gap: 14px;\n  padding-right: 20px;\n}\n"
          if anchor not in c:
              raise SystemExit('desktop grid target not found')
          c = c.replace(anchor, anchor + "\n.research-shell.is-browsing:not(.is-inspecting) .research-result-card.is-unfiltered {\n  grid-template-columns: 74px minmax(200px, 1fr) 72px;\n}\n", 1)
          mobile = "  .research-shell.is-browsing:not(.is-inspecting) .research-result-card:not(:has(.research-result-facts)) {\n    grid-template-columns: 76px minmax(0, 1fr);\n    gap: 12px;\n  }\n"
          if mobile not in c:
              raise SystemExit('mobile grid target not found')
          c = c.replace(mobile, mobile + "\n  .research-results-heading {\n    align-items: flex-start;\n    flex-direction: column;\n    gap: 4px;\n  }\n\n  .research-results-heading > div {\n    width: 100%;\n  }\n\n  .research-results-heading > div > span,\n  .research-results-context {\n    max-width: none;\n    text-align: left;\n    word-break: keep-all;\n  }\n", 1)
          css.write_text(c)

          for path in [Path('.github/workflows/apply-results-density.yml'), Path('.github/workflows/apply-results-density-push.yml')]:
              if path.exists():
                  path.unlink()
      - name: Commit focused patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: reduce empty results density"
          git push origin HEAD:ui/results-quickview-density-20260910
