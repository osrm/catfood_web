name: Apply mobile SWITCH review fixes

on:
  push:
    branches:
      - fix/mobile-switch-review-20260911

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mobile-switch-review-20260911
          fetch-depth: 0
      - name: Apply narrow mobile SWITCH fixes
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          flow = Path('src/SwitchFlow.tsx')
          text = flow.read_text()
          old = "          <li className={index === activeIndex ? 'is-current' : index < activeIndex ? 'is-done' : ''} key={label}>"
          new = "          <li aria-current={index === activeIndex ? 'step' : undefined} className={index === activeIndex ? 'is-current' : index < activeIndex ? 'is-done' : ''} key={label}>"
          if text.count(old) != 1:
              raise SystemExit(f'expected one progress item target, found {text.count(old)}')
          flow.write_text(text.replace(old, new))

          css = Path('src/switch-consumer-refresh.css')
          text = css.read_text()
          marker = '/* Mobile SWITCH review fixes: readable steps, one document scroll for current search, full-width candidate identity. */'
          if marker in text:
              raise SystemExit('mobile review fixes already present')
          encoded = ''
          css.write_text(text + b64decode(encoded).decode())
          PY
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SwitchFlow.tsx src/switch-consumer-refresh.css
          git diff --cached --check
          git commit -m "fix: refine mobile SWITCH layout"
          git push origin HEAD:fix/mobile-switch-review-20260911
