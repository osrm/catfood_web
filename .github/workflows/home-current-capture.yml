name: HOME current capture

on:
  push:
    branches:
      - qa/home-start-study-20260923

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA helper
        uses: actions/checkout@v5
        with:
          ref: qa/home-start-study-20260923
          persist-credentials: false

      - name: Install browser driver
        run: |
          mkdir -p /tmp/catfood-home-current
          cp qa/home-current-capture.mjs /tmp/catfood-home-current/
          cd /tmp/catfood-home-current
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Capture current deployed HOME
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/qa-output" node /tmp/catfood-home-current/home-current-capture.mjs

      - name: Upload HOME evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-current-study
          path: qa-output
          if-no-files-found: error
          retention-days: 7
