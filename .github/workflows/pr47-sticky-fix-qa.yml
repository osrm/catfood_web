name: PR47 sticky fix candidate QA

on:
  push:
    branches:
      - qa/pr47-sticky-fix-candidate-20260918

permissions:
  contents: read

env:
  PRODUCT_SHA: 5d11aee6e096f99db025ef211d6ab16095a36316
  QA_BASE: http://127.0.0.1:4173/catfood_web/
  BASELINE_BASE: https://osrm.github.io/catfood_web/
  VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard product sources against exact fix head
        run: |
          git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
          unexpected="$(git diff --name-only "$PRODUCT_SHA" | grep -v '^\.github/' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Korean font and report Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Check QA script syntax
        run: node --check .github/pr47-sticky-fix-qa.mjs

      - name: Build exact candidate with Pages public config
        run: |
          npm run build
          grep -Eq '(src|href)="\./assets/' dist/index.html

      - name: Serve exact candidate under project-site base
        run: |
          mkdir -p qa-site/catfood_web
          cp -R dist/. qa-site/catfood_web/
          python3 -m http.server 4173 --directory qa-site >/tmp/pr47-http.log 2>&1 &
          echo $! >/tmp/pr47-http.pid
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4173/catfood_web/ >/dev/null; then exit 0; fi
            sleep 0.1
          done
          cat /tmp/pr47-http.log
          exit 1

      - name: Run focused sticky browser QA
        run: node .github/pr47-sticky-fix-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr47-sticky-fix-browser-qa
          path: qa-artifacts/pr47-sticky-fix/
          if-no-files-found: error
          retention-days: 90
