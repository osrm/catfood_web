name: SWITCH candidate review
on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'index.html'
      - 'src/ApplicationBoundary.tsx'
      - 'src/IngredientListReason.tsx'
      - 'src/ingredient-list-reason.css'
      - 'src/ingredient-disclosure.ts'
      - 'src/energy-refine.tsx'
      - 'src/switch-energy.tsx'
      - 'src/switch-session.ts'
      - 'src/api.ts'
      - 'src/research-ui.css'
      - 'src/SwitchFlow.tsx'
      - 'src/switch-results-reviewed.css'
      - 'src/switch-consumer-flow.css'
      - 'src/main.tsx'
      - 'tests/switch-session-navigation.test.mjs'
      - 'tests/exploration.test.mjs'
      - 'tests/startup.test.mjs'
      - 'tests/catalog-ingredients.test.mjs'
      - 'qa/switch-results-candidate-review.mjs'
      - 'qa/selection-journeys-review.mjs'
      - 'qa/startup-and-ingredient-reasons.mjs'
      - '.github/workflows/switch-results-candidate-review.yml'
permissions:
  contents: read
jobs:
  candidate-review:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Exact candidate production build
        run: npm run build
      - name: Install browser driver
        run: |
          mkdir -p /tmp/switch-candidate-review
          cp qa/switch-results-candidate-review.mjs /tmp/switch-candidate-review/
          cp qa/selection-journeys-review.mjs /tmp/switch-candidate-review/
          cp qa/startup-and-ingredient-reasons.mjs /tmp/switch-candidate-review/
          cd /tmp/switch-candidate-review
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"; else echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"; fi
      - name: Serve exact candidate
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/catfood-preview.log 2>&1 &
          echo $! > /tmp/catfood-preview.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/catfood-preview.log
          exit 1
      - name: Narrow real-data interaction QA
        run: OUT_DIR="$GITHUB_WORKSPACE/switch-results-candidate-output" node /tmp/switch-candidate-review/switch-results-candidate-review.mjs
      - name: Selection journey interaction QA
        run: OUT_DIR="$GITHUB_WORKSPACE/selection-journeys-output" node /tmp/switch-candidate-review/selection-journeys-review.mjs
      - name: Startup recovery and ingredient reasons QA
        run: OUT_DIR="$GITHUB_WORKSPACE/startup-ingredient-output" node /tmp/switch-candidate-review/startup-and-ingredient-reasons.mjs
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-results-candidate-review
          path: switch-results-candidate-output
          retention-days: 7
      - name: Upload startup and ingredient evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-ingredient-review
          path: startup-ingredient-output
          retention-days: 7
      - name: Upload selection journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-journeys-review
          path: selection-journeys-output
          retention-days: 7
