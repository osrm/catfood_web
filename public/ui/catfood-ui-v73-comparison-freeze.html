<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CATFOOD UI v73 — Comparison Freeze</title>
</head>
<body>
<script>
(async()=>{
  const response=await fetch('./catfood-ui-v70-warm-editorial-polish.html');
  let html=await response.text();
  const polish=`<style>
    /* v71 typography hierarchy */
    .section-head h2{font-size:27px}
    .section-head p{color:#948b84}
    .section-kicker{color:#b0a8a1}
    .spec-row{min-height:82px}
    .spec-label{padding:20px 24px 20px 0;align-self:center}
    .spec-label b{font-size:15px;font-weight:730;color:#5b5049;letter-spacing:-.015em}
    .spec-label small{font-size:11px;font-weight:500;color:#a49a92;margin-top:6px;line-height:1.45}
    .spec-value{padding:20px 24px;font-size:20px;font-weight:830;color:#1c1714;letter-spacing:-.025em;font-variant-numeric:tabular-nums}

    /* v72 line / density polish */
    .section-accent{display:none}
    .section-head{margin-bottom:24px}
    .basic-spec{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .spec-row{border-bottom:1px solid var(--line-soft)}
    .spec-value{border-left:0}

    /* v73 final line cleanup */
    .nutrient-value,.energy-value{border-left:0}
    .nutrition-board{border-bottom:0}
    .energy-strip{margin-top:0;background:transparent;border-left:0;border-right:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line);min-height:96px}

    /* Keep guidance, but move microcopy behind the data hierarchy. */
    .notice{color:#b0a8a1;font-size:9px}
    .section-head p{font-size:11px;color:#9a918a}
    .section-kicker{font-size:9px;color:#b0a8a1}
    .subhead p,.subhead span{color:#a09790}
    .nutri-note{font-size:9px;color:#a39a93}
    .bottom-note{font-size:9px;color:#9d958e}
    .bottom-note strong{color:#746b64}

    /* Compact the life-stage graphic without changing its meaning. */
    .life-wrap{background:rgba(255,254,250,.42);border-left:0;border-right:0;border-color:var(--line);padding:18px 8px 16px}
    .life-top{margin-bottom:16px}
    .life-rows{gap:9px}
    .life-row{gap:16px}
    .range-track{height:8px}
    .range-category{height:29px}
    .life-note{font-size:9px;color:#9a918a;margin-top:10px;padding-top:10px}

    @media(max-width:1280px){.spec-label b{font-size:14px}.spec-value{font-size:18px}}
  </style>`;
  html=html.replace('<title>CATFOOD UI v70 — Warm Editorial Polish</title>','<title>CATFOOD UI v73 — Comparison Freeze</title>');
  html=html.replace('</head>',polish+'</head>');
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
