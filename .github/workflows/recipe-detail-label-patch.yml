name: Apply recipe detail display labels

on:
  push:
    branches:
      - ui/recipe-detail-korean-labels-20260910
    paths:
      - .github/workflows/recipe-detail-label-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/recipe-detail-korean-labels-20260910
      - name: Update display dictionaries only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app_labels = """const RECIPE_DETAIL_LABELS: Record<string, string> = {
            chicken: '닭', duck: '오리', turkey: '칠면조', beef: '소', lamb: '양', rabbit: '토끼', salmon: '연어',
            tuna: '참치', herring: '청어', mackerel: '고등어', trout: '송어', cod: '대구', pork: '돼지', venison: '사슴',
            anchovy: '멸치', beef_liver: '소 간', bonito: '보니토(Bonito)', bream: '도미류(Bream)', cheese: '치즈',
            chicken_liver: '닭 간', coconut_oil: '코코넛오일', egg: '계란', goat: '염소', goose: '거위', green_mussel: '초록홍합',
            haddock: '해덕대구', hoki: '호키', kahawai: 'Kahawai', mussel: '홍합류', mutton: '양고기(Mutton)', pheasant: '꿩',
            poultry_hearts: '가금류 심장', poultry_liver: '가금류 간', pumpkin: '호박', quail: '메추리', rice: '쌀', rooster: '수탉',
            sardine: '정어리', sea_bass: '농어류(Sea bass)', sea_bream: '도미류(Sea bream)', shirasu: '치어(Shirasu)', shrimp: '새우',
            skipjack_tuna: '가다랑어(Skipjack tuna)', southern_blue_whiting: '남방청대구', tuna_roe: '참치알', wallaby: '왈라비',
            whitefish: '흰살생선', wild_boar: '야생 멧돼지',
          }"""

          shared_labels = """const RECIPE_LABELS: Record<string, string> = {
            poultry: '가금류', poultry_unspecified: '가금류(종류 미상)', meat: '육류', fish: '생선', chicken: '닭',
            duck: '오리', turkey: '칠면조', goose: '거위', quail: '메추리', beef: '소', lamb: '양', goat: '염소',
            boar: '멧돼지', rabbit: '토끼', salmon: '연어', tuna: '참치', herring: '청어', mackerel: '고등어',
            trout: '송어', cod: '대구', sardine: '정어리', anchovy: '멸치', menhaden: '멘헤이든', whitefish: '흰살생선',
            pork: '돼지', venison: '사슴', egg: '계란', beef_liver: '소 간', bonito: '보니토(Bonito)', bream: '도미류(Bream)',
            cheese: '치즈', chicken_liver: '닭 간', coconut_oil: '코코넛오일', green_mussel: '초록홍합', haddock: '해덕대구',
            hoki: '호키', kahawai: 'Kahawai', mussel: '홍합류', mutton: '양고기(Mutton)', pheasant: '꿩',
            poultry_hearts: '가금류 심장', poultry_liver: '가금류 간', pumpkin: '호박', rice: '쌀', rooster: '수탉',
            sea_bass: '농어류(Sea bass)', sea_bream: '도미류(Sea bream)', shirasu: '치어(Shirasu)', shrimp: '새우',
            skipjack_tuna: '가다랑어(Skipjack tuna)', southern_blue_whiting: '남방청대구', tuna_roe: '참치알', wallaby: '왈라비',
            wild_boar: '야생 멧돼지',
          }"""

          def replace_one(path, pattern, replacement):
            p = Path(path)
            text = p.read_text()
            updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
            if count != 1:
              raise SystemExit(f'{path}: expected one mapping block, found {count}')
            p.write_text(updated)

          replace_one('src/App.tsx', r"const RECIPE_DETAIL_LABELS: Record<string, string> = \{.*?\n\}", app_labels)
          replace_one('src/ProductDetail.tsx', r"const RECIPE_LABELS: Record<string, string> = \{.*?\n\}", shared_labels)
          replace_one('src/CompareView.tsx', r"const RECIPE_LABELS: Record<string, string> = \{.*?\n\}", shared_labels)
          PY
          git diff --check
          git diff -- src/App.tsx src/ProductDetail.tsx src/CompareView.tsx
      - name: Commit clean source-only result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recipe-detail-label-patch.yml
          git add src/App.tsx src/ProductDetail.tsx src/CompareView.tsx
          git commit -m 'ui: localize recipe detail labels'
          git push origin HEAD:ui/recipe-detail-korean-labels-20260910
