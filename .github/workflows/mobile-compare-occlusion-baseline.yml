name: Mobile compare occlusion baseline

on:
  push:
    branches:
      - qa/mobile-compare-occlusion-baseline-20260912

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match baseline
        run: git diff --exit-code 5c3d371eaf8d54ccac9b179757ed0164072e8dbe -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - name: Install and build baseline
        run: |
          cp .env.example .env.local
          npm ci
          npm run build
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Start local preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mobile-compare-preview.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/catfood_web/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/mobile-compare-preview.log
          exit 1
      - name: Reproduce occlusion as failing assertion
        run: node .github/mobile-compare-occlusion-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-compare-occlusion-baseline
          path: qa-artifacts/
          if-no-files-found: warn
