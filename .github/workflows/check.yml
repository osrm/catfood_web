name: Frontend checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  live-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - home
          - hills
          - invalid
          - detailNav
          - detailKeys
          - lookupReplace
          - lookupBack
          - failureError
          - failureRetry
          - m390Scroll
          - m390Sticky
          - m390Touch
          - m390Text
          - m360Scroll
          - m360Sticky
          - m360Touch
          - m360Text
    name: live-browser (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/live-browser-audit-v2.mjs "${{ matrix.group }}"
