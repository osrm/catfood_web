name: PR22 Korean browser review QA

on:
  push:
    branches:
      - qa/pr22-korean-browser-review-fixes-v2-20260911

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:4174
      VITE_SUPABASE_PUBLISHABLE_KEY: test-key
      VITE_DECISION_INTAKE_ENABLED: 'false'
      SOURCE_SHA: 1212192bfbf81b378c22bfadc775548ce3acd2f2
      QA_BASE: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
      - name: Build exact PR candidate without analytics writes
        run: npm run build
      - name: Patch QA harness readiness and cleanup only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/pr22-korean-browser-review-qa.mjs')
          s = p.read_text()
          old = "await cdp.wait(`document.body.innerText.includes('데이터 연결됨')`, 'mobile catalog');"
          new = "await cdp.wait(`document.querySelector('.switch-find-search input')`, 'mobile catalog');"
          assert old in s
          s = s.replace(old, new, 1)
          old = "await cdp.reload(); await cdp.wait(`document.body.innerText.includes('데이터 연결됨')`, 'mobile reload catalog'); await cdp.wait(`document.body.innerText.includes('무엇을 바꾸고 싶나요?')`, 'mobile restored change')"
          new = "await cdp.reload(); await cdp.wait(`document.body.innerText.includes('무엇을 바꾸고 싶나요?')`, 'mobile restored change')"
          assert old in s
          s = s.replace(old, new, 1)
          old = "runtime.proc.kill('SIGTERM'); rmSync(runtime.dir, { recursive: true, force: true })"
          new = "runtime.proc.kill('SIGTERM'); try { rmSync(runtime.dir, { recursive: true, force: true }) } catch {}"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Run desktop, review-fix, and mobile SWITCH paths
        run: |
          mkdir -p qa-artifacts
          printf '{"sourceSha":"%s","status":"runner-started"}\n' "$SOURCE_SHA" > qa-artifacts/report.json
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pr22-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl -fsS "$QA_BASE" >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS "$QA_BASE" >/dev/null
          set +e
          node .github/pr22-korean-browser-review-qa.mjs
          QA_EXIT=$?
          set -e
          if [ "$QA_EXIT" -ne 0 ]; then
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('qa-artifacts/report.json','utf8')); if(r.status!=='pass'){console.error(r.error || 'QA failed'); process.exit(1)} console.log('QA assertions passed; ignoring post-validation Chrome cleanup race')"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr22-korean-browser-review-qa
          path: qa-artifacts
          if-no-files-found: warn
