name: Explore condition review current

on:
  push:
    branches:
      - qa/explore-condition-review-20260926

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install browser driver
        run: |
          mkdir -p /tmp/explore-condition-review
          cp qa/explore-condition-review/capture-current.mjs /tmp/explore-condition-review/
          cd /tmp/explore-condition-review
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi
      - name: Capture public Pages condition editor
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/explore-condition-current" \
          node /tmp/explore-condition-review/capture-current.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-condition-current
          path: explore-condition-current
          if-no-files-found: warn
          retention-days: 7
