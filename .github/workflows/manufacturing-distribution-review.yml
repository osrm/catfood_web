name: Manufacturing distribution detail review

on:
  push:
    branches:
      - qa/manufacturing-distribution-review-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: af8b3d01689ab5e2985f1a89256a0bc1a8aef7c5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify target main and product sources
        run: |
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          git diff --exit-code "$TARGET_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html .env.example

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Korean font environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Verify deployed Pages UI is reachable
        run: |
          curl -fsS --retry 5 --retry-delay 2 https://osrm.github.io/catfood_web/ >/tmp/catfood-pages.html
          grep -q './assets/' /tmp/catfood-pages.html

      - name: Run focused manufacturing and distribution review
        run: node .github/manufacturing-distribution-review.mjs

      - name: Upload review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-distribution-detail-review
          path: qa-artifacts/manufacturing-distribution-review/
          if-no-files-found: error
          retention-days: 90
