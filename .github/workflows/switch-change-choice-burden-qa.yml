name: SWITCH change choice burden QA

on:
  push:
    branches:
      - qa/switch-change-choice-burden-20260915

permissions:
  contents: read

env:
  MERGE_SHA: c44766d31642005079a9b44fdcb70994b344830b

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify QA branch preserves exact product sources
        run: git diff --exit-code "$MERGE_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Measure deployed CHANGE choice burden in real Chrome
        run: node .github/switch-change-choice-burden-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-change-choice-burden-qa
          path: qa-artifacts
          if-no-files-found: warn
