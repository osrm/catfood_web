name: Mobile SWITCH compare disclosure QA

on:
  push:
    branches:
      - qa/mobile-switch-compare-disclosure-20260916

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    env:
      PRODUCT_SHA: 86687bb6ec1fa8e2cf2b9e75a80f5494a058bd8c
      BASELINE_URL: https://osrm.github.io/catfood_web/
      TARGET_URL: http://127.0.0.1:4173/
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify QA branch preserves exact product sources
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and run existing checks
        run: |
          npm ci
          npm test
          npm run build

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Serve exact candidate build and run focused real-Chrome QA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/mobile-switch-compare-disclosure-qa.mjs')
          s = p.read_text()
          old = "outline:toggle?getComputedStyle(toggle).outlineStyle:null})"
          new = "outline:toggle?getComputedStyle(toggle).outlineStyle:null}"
          if old not in s:
              raise SystemExit('expected QA snapshot typo not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check .github/mobile-switch-compare-disclosure-qa.mjs
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/catfood-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node .github/mobile-switch-compare-disclosure-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-switch-compare-disclosure-qa
          path: qa-artifacts
          if-no-files-found: ignore
