name: PR38 SWITCH scroll restoration final5 QA

on:
  push:
    branches:
      - qa/pr38-scroll-restoration-final5-20260915

permissions:
  contents: read

env:
  PRODUCT_SHA: bc71fd8ccfc251eb90fdda791705a401c8783f09
  QA_BASE: http://127.0.0.1:4173/catfood_web/
  VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
  VITE_DECISION_INTAKE_ENABLED: 'false'

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify QA branch preserves exact product sources
        run: git diff --exit-code "$PRODUCT_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Build exact product head
        run: npm run build

      - name: Prepare final QA harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pr38-scroll-restoration-final-qa.mjs')
          text = path.read_text()
          old_desktop = """    await visible(c, '.switch-step-actions .switch-primary-action', 0, '.switch-step-main')\n    const before = await scrollInfo(c, '.switch-step-main')\n    assert.ok(before.top > 0, JSON.stringify(before))\n"""
          new_desktop = """    await visible(c, '.switch-step-actions .switch-primary-action', 0, '.switch-step-main')\n    await wheelOwner(c, '.switch-step-main', 120)\n    const before = await scrollInfo(c, '.switch-step-main')\n    assert.ok(before.top > 0, JSON.stringify(before))\n"""
          old_cleanup = """async function cleanup(handle) {\n  handle.c.close()\n  handle.proc.kill('SIGTERM')\n  await sleep(80)\n  if (handle.proc.exitCode == null) handle.proc.kill('SIGKILL')\n  rmSync(handle.dir, { recursive: true, force: true })\n}\n"""
          new_cleanup = """async function cleanup(handle) {\n  handle.c.close()\n  handle.proc.kill('SIGTERM')\n  await sleep(80)\n  if (handle.proc.exitCode == null) handle.proc.kill('SIGKILL')\n  for (let attempt = 0; attempt < 5; attempt++) {\n    try {\n      rmSync(handle.dir, { recursive: true, force: true })\n      return\n    } catch (error) {\n      if (attempt === 4) {\n        console.warn('QA cleanup warning:', String(error))\n        return\n      }\n      await sleep(80)\n    }\n  }\n}\n"""
          if old_desktop not in text:
              raise SystemExit('desktop QA patch target not found')
          if old_cleanup not in text:
              raise SystemExit('cleanup QA patch target not found')
          text = text.replace(old_desktop, new_desktop, 1)
          text = text.replace(old_cleanup, new_cleanup, 1)
          path.write_text(text)
          PY

      - name: Serve candidate build
        run: |
          mkdir -p qa-site/catfood_web
          cp -R dist/. qa-site/catfood_web/
          python3 -m http.server 4173 --directory qa-site >/tmp/pr38-restoration-final5-http.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4173/catfood_web/" >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS "http://127.0.0.1:4173/catfood_web/" >/dev/null

      - name: Validate final navigation scroll and restoration in real Chrome
        run: node .github/pr38-scroll-restoration-final-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr38-scroll-restoration-final5-qa
          path: qa-artifacts
          if-no-files-found: warn
