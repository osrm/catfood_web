name: Temporary compare lazy-read patch

on:
  push:
    branches:
      - perf/compare-lazy-tab-reads-20261008

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused CompareView lazy-read patch
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          p = Path('src/CompareView.tsx')
          s = p.read_text()

          replacements = {
            "const [currentNutritionLoading, setCurrentNutritionLoading] = useState(false)": "const [currentNutritionLoading, setCurrentNutritionLoading] = useState(Boolean(currentProduct && initialTab === 'nutrition'))",
            "const [currentVariantsLoading, setCurrentVariantsLoading] = useState(false)": "const [currentVariantsLoading, setCurrentVariantsLoading] = useState(Boolean(currentProduct && initialTab === 'nutrition'))",
            "const [variantsLoading, setVariantsLoading] = useState(false)": "const [variantsLoading, setVariantsLoading] = useState(initialTab !== 'overview')",
            "const [nutritionLoading, setNutritionLoading] = useState(false)": "const [nutritionLoading, setNutritionLoading] = useState(initialTab === 'nutrition')",
            "const [ingredientsLoading, setIngredientsLoading] = useState(false)": "const [ingredientsLoading, setIngredientsLoading] = useState(initialTab === 'ingredients')",
          }
          for old, new in replacements.items():
            assert old in s, old
            s = s.replace(old, new, 1)

          old = """  const pendingRemovalFocusRef = useRef<{ slot: 0 | 1 | null; remainingCount: number } | null>(null)\n  const mobileCandidateOptionsId = useId()\n\n  useEffect(() => { setTab(initialTab) }, [initialTab])\n  function selectTab(next: CompareTab, focus = false) {\n    setTab(next); onTabChange?.(next)\n    if (focus) requestAnimationFrame(() => tabRefs.current[TABS.findIndex(([key]) => key === next)]?.focus())\n  }\n"""
          new = """  const pendingRemovalFocusRef = useRef<{ slot: 0 | 1 | null; remainingCount: number } | null>(null)\n  const nutritionLoadedKeyRef = useRef<string | null>(null)\n  const ingredientsLoadedKeyRef = useRef<string | null>(null)\n  const variantsLoadedKeyRef = useRef<string | null>(null)\n  const currentNutritionLoadedProductRef = useRef<string | null>(null)\n  const currentVariantsLoadedProductRef = useRef<string | null>(null)\n  const mobileCandidateOptionsId = useId()\n\n  useEffect(() => {\n    setTab(initialTab)\n    const key = items.map((item) => item.product.product_id).join('|')\n    if (initialTab === 'nutrition') {\n      if (nutritionLoadedKeyRef.current !== key && !nutritionError) setNutritionLoading(true)\n      if (variantsLoadedKeyRef.current !== key) setVariantsLoading(true)\n      if (currentProduct) {\n        if (currentNutritionLoadedProductRef.current !== currentProduct.product_id && !currentNutritionError) setCurrentNutritionLoading(true)\n        if (currentVariantsLoadedProductRef.current !== currentProduct.product_id) setCurrentVariantsLoading(true)\n      }\n    } else if (initialTab === 'ingredients') {\n      if (ingredientsLoadedKeyRef.current !== key && !ingredientsError) setIngredientsLoading(true)\n      if (variantsLoadedKeyRef.current !== key) setVariantsLoading(true)\n    }\n  }, [initialTab])\n  function selectTab(next: CompareTab, focus = false) {\n    const key = items.map((item) => item.product.product_id).join('|')\n    if (next === 'nutrition') {\n      if (nutritionLoadedKeyRef.current !== key && !nutritionError) setNutritionLoading(true)\n      if (variantsLoadedKeyRef.current !== key) setVariantsLoading(true)\n      if (currentProduct) {\n        if (currentNutritionLoadedProductRef.current !== currentProduct.product_id && !currentNutritionError) setCurrentNutritionLoading(true)\n        if (currentVariantsLoadedProductRef.current !== currentProduct.product_id) setCurrentVariantsLoading(true)\n      }\n    } else if (next === 'ingredients') {\n      if (ingredientsLoadedKeyRef.current !== key && !ingredientsError) setIngredientsLoading(true)\n      if (variantsLoadedKeyRef.current !== key) setVariantsLoading(true)\n    }\n    setTab(next); onTabChange?.(next)\n    if (focus) requestAnimationFrame(() => tabRefs.current[TABS.findIndex(([key]) => key === next)]?.focus())\n  }\n"""
          assert old in s
          s = s.replace(old, new, 1)

          old = "  const productIds = useMemo(() => items.map((item) => item.product.product_id), [items])\n"
          new = old + "  const productKey = productIds.join('|')\n"
          assert old in s
          s = s.replace(old, new, 1)

          pattern = re.compile(r"  useEffect\(\(\) => \{\n    const controller = new AbortController\(\); let active = true\n    setNutrition\(\[\]\); setIngredients\(\[\]\); setVariantsByProduct\(\{\}\); setVariantLookupFailures\(\[\]\); setVariantsLoading\(true\); setNutritionLoading\(true\); setIngredientsLoading\(true\); setNutritionError\(null\); setIngredientsError\(null\).*?\n  \}, \[productIds\.join\('\|'\), reload\]\)\n", re.S)
          match = pattern.search(s)
          assert match, 'candidate eager effect not found'
          new = """  useEffect(() => {\n    nutritionLoadedKeyRef.current = null\n    ingredientsLoadedKeyRef.current = null\n    variantsLoadedKeyRef.current = null\n    setNutrition([])\n    setIngredients([])\n    setVariantsByProduct({})\n    setVariantLookupFailures([])\n    setNutritionError(null)\n    setIngredientsError(null)\n    setNutritionLoading(tab === 'nutrition')\n    setIngredientsLoading(tab === 'ingredients')\n    setVariantsLoading(tab !== 'overview')\n  }, [productKey])\n\n  useEffect(() => {\n    if (tab !== 'nutrition' || !productIds.length) return\n    const needNutrition = nutritionLoadedKeyRef.current !== productKey && !nutritionError\n    const needVariants = variantsLoadedKeyRef.current !== productKey\n    if (!needNutrition && !needVariants) {\n      setNutritionLoading(false)\n      setVariantsLoading(false)\n      return\n    }\n    const controller = new AbortController(); let active = true\n    if (needNutrition) {\n      setNutritionLoading(true)\n      fetchCompareNutrition(productIds, controller.signal).then((rows) => {\n        if (!active) return\n        setNutrition(rows)\n        nutritionLoadedKeyRef.current = productKey\n      }).catch((reason: unknown) => {\n        if (reason instanceof DOMException && reason.name === 'AbortError') return\n        if (active) setNutritionError('영양 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.')\n      }).finally(() => { if (active) setNutritionLoading(false) })\n    } else setNutritionLoading(false)\n    if (needVariants) {\n      setVariantsLoading(true)\n      Promise.allSettled(productIds.map((id) => fetchProductVariants(id, controller.signal))).then((results) => {\n        if (!active) return\n        const next: Record<string, ProductVariant[]> = {}, failures: string[] = []\n        results.forEach((result, index) => {\n          const id = productIds[index]\n          if (result.status === 'fulfilled') next[id] = result.value\n          else if (!(result.reason instanceof DOMException && result.reason.name === 'AbortError')) failures.push(id)\n        })\n        setVariantsByProduct(next)\n        setVariantLookupFailures(failures)\n        variantsLoadedKeyRef.current = productKey\n        setVariantsLoading(false)\n      })\n    } else setVariantsLoading(false)\n    return () => { active = false; controller.abort() }\n  }, [tab, productKey, reload])\n\n  useEffect(() => {\n    if (tab !== 'ingredients' || !productIds.length) return\n    const needIngredients = ingredientsLoadedKeyRef.current !== productKey && !ingredientsError\n    const needVariants = variantsLoadedKeyRef.current !== productKey\n    if (!needIngredients && !needVariants) {\n      setIngredientsLoading(false)\n      setVariantsLoading(false)\n      return\n    }\n    const controller = new AbortController(); let active = true\n    if (needIngredients) {\n      setIngredientsLoading(true)\n      fetchCompareIngredients(productIds, controller.signal).then((rows) => {\n        if (!active) return\n        setIngredients(rows)\n        ingredientsLoadedKeyRef.current = productKey\n      }).catch((reason: unknown) => {\n        if (reason instanceof DOMException && reason.name === 'AbortError') return\n        if (active) setIngredientsError('원재료 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.')\n      }).finally(() => { if (active) setIngredientsLoading(false) })\n    } else setIngredientsLoading(false)\n    if (needVariants) {\n      setVariantsLoading(true)\n      Promise.allSettled(productIds.map((id) => fetchProductVariants(id, controller.signal))).then((results) => {\n        if (!active) return\n        const next: Record<string, ProductVariant[]> = {}, failures: string[] = []\n        results.forEach((result, index) => {\n          const id = productIds[index]\n          if (result.status === 'fulfilled') next[id] = result.value\n          else if (!(result.reason instanceof DOMException && result.reason.name === 'AbortError')) failures.push(id)\n        })\n        setVariantsByProduct(next)\n        setVariantLookupFailures(failures)\n        variantsLoadedKeyRef.current = productKey\n        setVariantsLoading(false)\n      })\n    } else setVariantsLoading(false)\n    return () => { active = false; controller.abort() }\n  }, [tab, productKey, reload])\n"""
          s = s[:match.start()] + new + s[match.end():]

          pattern = re.compile(r"  useEffect\(\(\) => \{\n    if \(!currentProduct \|\| tab !== 'nutrition'\) \{.*?\n  \}, \[currentProduct\?\.product_id, tab, currentNutritionReload\]\)\n", re.S)
          match = pattern.search(s)
          assert match, 'current nutrition eager-reset effect not found'
          new = """  useEffect(() => {\n    currentNutritionLoadedProductRef.current = null\n    currentVariantsLoadedProductRef.current = null\n    setCurrentNutrition(null)\n    setCurrentNutritionError(null)\n    setCurrentVariants([])\n    setCurrentVariantLookupFailed(false)\n    setCurrentNutritionLoading(Boolean(currentProduct && tab === 'nutrition'))\n    setCurrentVariantsLoading(Boolean(currentProduct && tab === 'nutrition'))\n  }, [currentProduct?.product_id])\n\n  useEffect(() => {\n    if (!currentProduct || tab !== 'nutrition') return\n    const productId = currentProduct.product_id\n    const needNutrition = currentNutritionLoadedProductRef.current !== productId && !currentNutritionError\n    const needVariants = currentVariantsLoadedProductRef.current !== productId\n    if (!needNutrition && !needVariants) {\n      setCurrentNutritionLoading(false)\n      setCurrentVariantsLoading(false)\n      return\n    }\n    const controller = new AbortController(); let active = true\n    if (needNutrition) {\n      setCurrentNutritionLoading(true)\n      fetchCompareNutrition([productId], controller.signal).then((rows) => {\n        if (!active) return\n        setCurrentNutrition(rows[0] ?? null)\n        currentNutritionLoadedProductRef.current = productId\n      }).catch((reason: unknown) => {\n        if (reason instanceof DOMException && reason.name === 'AbortError') return\n        if (active) setCurrentNutritionError('현재 사료 영양 정보를 불러오지 못했습니다.')\n      }).finally(() => { if (active) setCurrentNutritionLoading(false) })\n    } else setCurrentNutritionLoading(false)\n    if (needVariants) {\n      setCurrentVariantsLoading(true)\n      setCurrentVariantLookupFailed(false)\n      fetchProductVariants(productId, controller.signal).then((rows) => {\n        if (active) setCurrentVariants(rows)\n      }).catch((reason: unknown) => {\n        if (reason instanceof DOMException && reason.name === 'AbortError') return\n        if (active) setCurrentVariantLookupFailed(true)\n      }).finally(() => {\n        if (!active) return\n        currentVariantsLoadedProductRef.current = productId\n        setCurrentVariantsLoading(false)\n      })\n    } else setCurrentVariantsLoading(false)\n    return () => { active = false; controller.abort() }\n  }, [currentProduct?.product_id, tab, currentNutritionReload])\n"""
          s = s[:match.start()] + new + s[match.end():]

          old = "onClick={() => setReload((value) => value + 1)}>다시 시도</button>"
          assert s.count(old) == 2, s.count(old)
          nutrition_retry = "onClick={() => { nutritionLoadedKeyRef.current = null; setNutritionError(null); setNutritionLoading(true); setReload((value) => value + 1) }}>다시 시도</button>"
          ingredients_retry = "onClick={() => { ingredientsLoadedKeyRef.current = null; setIngredientsError(null); setIngredientsLoading(true); setReload((value) => value + 1) }}>다시 시도</button>"
          s = s.replace(old, nutrition_retry, 1)
          s = s.replace(old, ingredients_retry, 1)

          old = "onClick={() => setCurrentNutritionReload((value) => value + 1)}>현재 사료 다시 시도</button>"
          new = "onClick={() => { currentNutritionLoadedProductRef.current = null; setCurrentNutritionError(null); setCurrentNutritionLoading(true); setCurrentNutritionReload((value) => value + 1) }}>현재 사료 다시 시도</button>"
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)

          t = Path('tests/switch-compare-overview.test.mjs')
          s = t.read_text()
          old = """  const productFilters = requests.map((url) => url.searchParams.get('product_id')).filter(Boolean)\n  assert.ok(productFilters.length >= 4, `expected compare and variant requests, got ${requests.length}`)\n  assert.equal(productFilters.some((value) => value.includes(current.product_id)), false, `current product leaked into API filters: ${productFilters.join(' | ')}`)\n  assert.ok(productFilters.some((value) => value === 'in.(product_candidate_a,product_candidate_b)'))\n"""
          new = """  assert.equal(requests.length, 0, 'overview must not start compare nutrition, ingredients, or variant reads')\n"""
          assert old in s
          s = s.replace(old, new, 1)

          addition = r'''

test('comparison tabs load only active data and reuse successful candidate variants within the mount', async () => {
  await renderCompare()
  assert.equal(requests.length, 0)

  const nutritionTab = [...document.querySelectorAll('.compare-tabs button')].find((node) => node.textContent.trim() === '영양')
  const ingredientsTab = [...document.querySelectorAll('.compare-tabs button')].find((node) => node.textContent.trim() === '원재료')
  const overviewTab = [...document.querySelectorAll('.compare-tabs button')].find((node) => node.textContent.trim() === '개요')

  await click(nutritionTab)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/compare_product_nutrition')).length, 2, 'SWITCH nutrition keeps candidate and current reads separate')
  assert.equal(requests.filter((url) => url.pathname.endsWith('/compare_product_ingredients')).length, 0)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/switch_current_variant_options')).length, 3, 'two candidates plus current variant lookup')

  const afterNutrition = requests.length
  await click(overviewTab)
  assert.equal(requests.length, afterNutrition, 'overview must not start hidden reads after nutrition')

  await click(ingredientsTab)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/compare_product_ingredients')).length, 1)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/switch_current_variant_options')).length, 3, 'candidate variants are reused from nutrition')
  const afterIngredients = requests.length

  await click(nutritionTab)
  assert.equal(requests.length, afterIngredients, 'loaded nutrition/current/variant data are reused on tab round-trip')
})

test('general comparison overview is read-free and first active tab controls which comparison resource loads', async () => {
  await renderCompare({ currentProduct: null })
  assert.equal(requests.length, 0)
  const ingredientsTab = [...document.querySelectorAll('.compare-tabs button')].find((node) => node.textContent.trim() === '원재료')
  const nutritionTab = [...document.querySelectorAll('.compare-tabs button')].find((node) => node.textContent.trim() === '영양')
  await click(ingredientsTab)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/compare_product_ingredients')).length, 1)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/compare_product_nutrition')).length, 0)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/switch_current_variant_options')).length, 2)
  const afterIngredients = requests.length
  await click(nutritionTab)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/compare_product_nutrition')).length, 1)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/switch_current_variant_options')).length, 2, 'variants stay reused across candidate tabs')
  const afterNutrition = requests.length
  await click(ingredientsTab)
  assert.equal(requests.length, afterNutrition)
  assert.ok(afterNutrition > afterIngredients)
})

test('deep-linked comparison tab starts only its required reads', async () => {
  await renderCompare({ initialTab: 'ingredients' })
  assert.equal(requests.filter((url) => url.pathname.endsWith('/compare_product_ingredients')).length, 1)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/compare_product_nutrition')).length, 0)
  assert.equal(requests.filter((url) => url.pathname.endsWith('/switch_current_variant_options')).length, 2)
})
'''
          s += addition
          t.write_text(s)
          PY
          python /tmp/patch.py
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/CompareView.tsx tests/switch-compare-overview.test.mjs
          git commit -m "perf: load comparison data by active tab"
          git push origin HEAD:perf/compare-lazy-tab-reads-20261008
