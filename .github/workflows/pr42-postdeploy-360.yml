name: Apply lookup guidance patch

on:
  push:
    branches:
      - qa/pr42-postdeploy-360-20260916

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 83e4ca5acb8ac4f44b28c840260c63c679403195
      PRODUCT_BRANCH: fix/lookup-results-initial-guidance-20260917
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0

      - name: Verify exact product baseline
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Apply only the LOOKUP heading guidance branch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = "<span>{loading || waitingForConditions ? '조건을 고르면 결과가 표시됩니다.' : visibleProducts.length < resultProducts.length ? `${resultProducts.length}개 중 ${visibleProducts.length}개 표시` : `${resultProducts.length}개의 제품`}</span>"
          new = "<span>{loading || waitingForConditions ? mode === 'lookup' ? '브랜드나 제품명을 입력하면 결과가 표시됩니다.' : '조건을 고르면 결과가 표시됩니다.' : visibleProducts.length < resultProducts.length ? `${resultProducts.length}개 중 ${visibleProducts.length}개 표시` : `${resultProducts.length}개의 제품`}</span>"
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only | tr -d '\n')" = "src/App.tsx"
          git diff -- src/App.tsx

      - name: Commit product change
        run: |
          git config user.name "osrm"
          git config user.email "90407222+osrm@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: clarify lookup result guidance"
          git push origin HEAD:"$PRODUCT_BRANCH"
