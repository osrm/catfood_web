name: PR50 postdeploy evidence

on:
  push:
    branches:
      - qa/pr50-postdeploy-evidence-20260923

permissions:
  contents: read

jobs:
  postdeploy:
    runs-on: ubuntu-latest
    env:
      EXPECTED_MERGE_SHA: 6598960b4d60a662fb5efc41742f896387d00562
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v5
        with:
          ref: qa/pr50-postdeploy-evidence-20260923
          persist-credentials: false

      - name: Install browser driver
        run: |
          mkdir -p /tmp/catfood-pr50-postdeploy
          cp qa/pr50-postdeploy.mjs /tmp/catfood-pr50-postdeploy/
          cd /tmp/catfood-pr50-postdeploy
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Run deployed Pages evidence check
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/qa-output" node /tmp/catfood-pr50-postdeploy/pr50-postdeploy.mjs

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr50-postdeploy-evidence
          path: qa-output
          if-no-files-found: error
          retention-days: 7
