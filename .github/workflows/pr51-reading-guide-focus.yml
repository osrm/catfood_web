name: PR51 reading guide QA

on:
  push:
    branches:
      - qa/pr51-reading-guide-focus-20260923

permissions:
  contents: read

jobs:
  reading-guide:
    runs-on: ubuntu-latest
    env:
      PRODUCT_SHA: 41d57fe9083267d26312d393a569787c7b7f0f2b
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v5
        with:
          ref: qa/pr51-reading-guide-focus-20260923
          persist-credentials: false

      - name: Checkout exact product head
        uses: actions/checkout@v5
        with:
          ref: 41d57fe9083267d26312d393a569787c7b7f0f2b
          path: candidate
          persist-credentials: false

      - name: Guard exact product source
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C candidate status --short)" = ""

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: candidate/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Build exact candidate
        run: |
          cd candidate
          npm ci
          npm run build

      - name: Start candidate preview
        run: |
          cd candidate
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/catfood-pr51-preview.log 2>&1 &
          echo $! >/tmp/catfood-pr51-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/catfood-pr51-preview.log
          exit 1

      - name: Install browser driver
        run: |
          mkdir -p /tmp/catfood-pr51-reading-guide
          cp qa/pr51-reading-guide-focus.mjs /tmp/catfood-pr51-reading-guide/
          cd /tmp/catfood-pr51-reading-guide
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Run reading guide focus QA
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/qa-output" node /tmp/catfood-pr51-reading-guide/pr51-reading-guide-focus.mjs

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr51-reading-guide-focus-evidence
          path: qa-output
          if-no-files-found: error
          retention-days: 7
