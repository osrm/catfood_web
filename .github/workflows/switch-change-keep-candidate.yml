name: SWITCH CHANGE KEEP candidate QA

on:
  push:
    branches:
      - feat/switch-change-keep-20260926

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test, typecheck and build exact candidate
        run: npm test && npm run build

      - name: Start exact candidate build
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/switch-change-keep-candidate.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/switch-change-keep-candidate.log
          exit 1

      - name: Install browser driver
        run: |
          mkdir -p /tmp/switch-change-keep-candidate
          cp qa/switch-change-keep-candidate.mjs /tmp/switch-change-keep-candidate/
          cd /tmp/switch-change-keep-candidate
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Run actual candidate UI QA
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/switch-change-keep-candidate-output" \
          node /tmp/switch-change-keep-candidate/switch-change-keep-candidate.mjs

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-change-keep-candidate
          path: switch-change-keep-candidate-output
          if-no-files-found: warn
          retention-days: 7
