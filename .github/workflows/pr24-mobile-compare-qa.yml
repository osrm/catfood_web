name: PR24 mobile compare QA

on:
  push:
    branches:
      - qa/pr24-mobile-compare-column-width-20260912

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: 430622a2fad1dc240e872f1c4828a057becc98ed
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
      VITE_DECISION_INTAKE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify product sources match PR head
        run: git diff --exit-code "$TARGET_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Korean font environment
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version
      - name: Build exact review candidate
        run: npm run build
      - name: Serve candidate under Pages base path
        run: |
          mkdir -p qa-site/catfood_web
          cp -R dist/. qa-site/catfood_web/
          python3 -m http.server 4173 --directory qa-site >/tmp/pr24-http.log 2>&1 &
          echo $! >/tmp/pr24-http.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/catfood_web/ >/dev/null; then exit 0; fi
            sleep 0.1
          done
          cat /tmp/pr24-http.log
          exit 1
      - name: Run mobile compare regression QA
        run: node .github/pr24-mobile-compare-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr24-mobile-compare-qa
          path: qa-artifacts/
          if-no-files-found: warn
