<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CATFOOD EXPLORE condition editor static QA prototype. Controls are nonfunctional mock elements.">
  <title>CATFOOD EXPLORE 조건 편집 시안</title>
  <link rel="stylesheet" href="./explore-conditions-prototype.css">
</head>
<body data-static-prototype="true">
  <div class="prototype-shell">
    <header class="topbar">
      <strong class="brand">CATFOOD</strong>
      <nav class="mode-nav" aria-label="탐색 모드">
        <button class="mode is-active" type="button">조건으로 찾기</button>
        <button class="mode" type="button">제품 찾기</button>
        <button class="mode" type="button">현재 사료</button>
      </nav>
    </header>

    <main class="stage">
      <section class="editor" aria-labelledby="editor-title">
        <header class="editor-heading">
          <h1 id="editor-title">조건 설정</h1>
          <span class="selection-count">10개 선택</span>
        </header>

        <section class="condition-group basic-group" aria-labelledby="basic-title">
          <div class="group-heading">
            <h2 id="basic-title">기본 조건</h2>
            <p>선택하면 필수 조건으로 적용</p>
          </div>

          <div class="group-grid basic-grid">
            <section class="field">
              <div class="field-heading"><h3>사료 형태</h3><span>선택 시 필수 조건</span></div>
              <div class="choice-grid">
                <button class="choice is-selected" type="button" aria-pressed="true">건식</button>
                <button class="choice" type="button" aria-pressed="false">습식</button>
                <button class="choice" type="button" aria-pressed="false">동결건조</button>
              </div>
            </section>

            <section class="field">
              <div class="field-heading"><h3>대상 연령</h3><span>제품 라벨 기준</span></div>
              <div class="choice-grid">
                <button class="choice" type="button" aria-pressed="false">키튼</button>
                <button class="choice" type="button" aria-pressed="false">성묘</button>
                <button class="choice" type="button" aria-pressed="false">시니어</button>
                <button class="choice" type="button" aria-pressed="false">전연령</button>
                <button class="choice is-selected" type="button" aria-pressed="true">임신·수유·키튼</button>
              </div>
              <p class="field-note">실제 나이를 자동 변환하지 않고 제품이 표시한 연령 구분을 사용합니다.</p>
            </section>
          </div>
        </section>

        <section class="condition-group additional-group" aria-labelledby="additional-title">
          <div class="group-heading additional-heading">
            <div>
              <h2 id="additional-title">추가 조건</h2>
              <p>미확인은 후보에 유지</p>
            </div>
            <span class="additional-count">8개 선택</span>
            <span class="chevron" aria-hidden="true">⌃</span>
          </div>

          <div class="group-grid additional-grid">
            <section class="field">
              <div class="field-heading"><h3>제품 표기 대상</h3><span>여러 개 선택 가능</span></div>
              <div class="choice-grid">
                <button class="choice is-selected" type="button" aria-pressed="true">실내묘</button>
                <button class="choice is-selected" type="button" aria-pressed="true">중성화묘</button>
              </div>
            </section>

            <section class="field">
              <div class="field-heading"><h3>제품 특징</h3><span>제조사 공식 표기 기준</span></div>
              <div class="choice-grid">
                <button class="choice is-selected" type="button" aria-pressed="true">체중 관리</button>
                <button class="choice" type="button" aria-pressed="false">변 상태</button>
                <button class="choice" type="button" aria-pressed="false">헤어볼</button>
                <button class="choice is-selected" type="button" aria-pressed="true">소화</button>
                <button class="choice" type="button" aria-pressed="false">요로</button>
                <button class="choice is-selected" type="button" aria-pressed="true">피부·피모</button>
                <button class="choice" type="button" aria-pressed="false">덴탈</button>
              </div>
            </section>

            <section class="field">
              <div class="field-heading"><h3>레시피 종류</h3><span>확인된 정보 기준</span></div>
              <div class="choice-grid">
                <button class="choice is-selected" type="button" aria-pressed="true">가금류</button>
                <button class="choice" type="button" aria-pressed="false">육류</button>
                <button class="choice is-selected" type="button" aria-pressed="true">생선</button>
              </div>
            </section>

            <section class="field">
              <div class="field-heading"><h3>레시피 특성</h3><span>제품의 공식 표기만 확인</span></div>
              <div class="choice-grid one-column">
                <button class="choice is-selected" type="button" aria-pressed="true">Grain-Free 표기</button>
              </div>
              <p class="field-note">표기가 없다고 해서 곡물이 들어 있다고 판단하지 않습니다.</p>
            </section>
          </div>
        </section>

        <div class="action-bar">
          <button class="reset-action" type="button">초기화</button>
          <button class="apply-action" type="button">이 조건으로 찾기</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
