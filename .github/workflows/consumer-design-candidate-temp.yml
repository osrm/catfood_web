name: Temporary consumer design candidate
on:
  push:
    branches:
      - tmp/consumer-design-candidate-20261002
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://gnosbstdatkytsyxuapt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_edpd7duWsG2uagRr-n3IHw_X1hEAjKV
      VITE_DECISION_INTAKE_ENABLED: "false"
      PRODUCT_SHA: 8b993e9f4f36bd9f6c78ec2f686040ce6f77677d
      PAGES_URL: https://osrm.github.io/catfood_web/
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Preserve QA source
        run: |
          mkdir -p /tmp/consumer-design-candidate
          cp qa/consumer-design-candidate.mjs /tmp/consumer-design-candidate/
      - name: Checkout exact product candidate
        uses: actions/checkout@v5
        with:
          ref: 8b993e9f4f36bd9f6c78ec2f686040ce6f77677d
          clean: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build exact product candidate
        run: |
          test "$(git log -1 --format=%H)" = "$PRODUCT_SHA"
          npm run build
      - name: Install browser driver
        run: |
          cd /tmp/consumer-design-candidate
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"; else echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"; fi
      - name: Serve exact product candidate
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/consumer-design-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/consumer-design-vite.log
          exit 1
      - name: Chrome candidate and baseline review
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/consumer-design-candidate-output" CANDIDATE_URL="http://127.0.0.1:4173/" PAGES_URL="$PAGES_URL" PRODUCT_SHA="$PRODUCT_SHA" node /tmp/consumer-design-candidate/consumer-design-candidate.mjs
          cp /tmp/consumer-design-candidate/consumer-design-candidate.mjs "$GITHUB_WORKSPACE/consumer-design-candidate-output/validation-source.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-design-candidate
          path: consumer-design-candidate-output
          retention-days: 7
