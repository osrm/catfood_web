name: Explore conditions review

on:
  push:
    branches:
      - qa/explore-conditions-prototype-20260926

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Confirm public Pages
        run: |
          for i in {1..30}; do
            if curl --fail --silent --location --header 'Cache-Control: no-cache' https://osrm.github.io/catfood_web/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Install browser driver
        run: |
          mkdir -p /tmp/explore-conditions-review
          cp qa/explore-conditions-review/capture-current.mjs /tmp/explore-conditions-review/
          cd /tmp/explore-conditions-review
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright-core@1.55.1
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            exit 1
          fi
      - name: Capture current deployed condition editor
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/explore-conditions-current" \
          node /tmp/explore-conditions-review/capture-current.mjs
      - name: Upload current evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-conditions-current
          path: explore-conditions-current
          if-no-files-found: warn
          retention-days: 7
