name: Apply mobile SWITCH mode navigation fix v2

on:
  pull_request:
    branches:
      - 'qa/apply-mobile-switch-mode-nav-fix-v2-20260912'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ff81a953ec67ae18e5f27d96b85b47109dd5ab30
      PRODUCT_BRANCH: fix/mobile-switch-mode-nav-accessibility-20260912
      PATCH_BRANCH: qa/apply-mobile-switch-mode-nav-fix-v2-20260912
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
      - name: Verify untouched product branch
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"
      - name: Apply approved three-file patch
        run: |
          git fetch origin "$PATCH_BRANCH"
          git show "FETCH_HEAD:.github/apply-mobile-switch-mode-nav-fix-v2.py" > /tmp/apply-mobile-switch-fix.py
          python3 /tmp/apply-mobile-switch-fix.py
      - name: Verify patch scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'src/App.tsx\nsrc/SwitchFlow.tsx\nsrc/switch-workflow.css'
          git diff -- src/App.tsx src/SwitchFlow.tsx src/switch-workflow.css
      - name: Commit product branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/SwitchFlow.tsx src/switch-workflow.css
          git commit -m 'fix: expose mobile switch mode navigation'
          git push origin "HEAD:$PRODUCT_BRANCH"
