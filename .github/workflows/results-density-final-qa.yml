name: Results Density Postdeploy QA

on:
  push:
    branches:
      - 'qa/results-density-pr17-final-20260910'
    paths:
      - '.github/workflows/results-density-final-qa.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: qa/results-density-pr17-final-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Capture deployed Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa-artifacts/postdeploy-pr17
          mkdir -p qa-artifacts/postdeploy-pr17
          node <<'NODE'
          import assert from 'node:assert/strict'
          import { spawn, execFileSync } from 'node:child_process'
          import { existsSync, rmSync, writeFileSync } from 'node:fs'

          const PROD='https://osrm.github.io/catfood_web/'
          const DEPLOY_SHA='41346569f410d8caf9540f5e7be04a1de9847ec9'
          const NONE='?view=workspace&applied=1'
          const LONG='?view=workspace&applied=1&age=adult&targets=indoor,sterilized&features=hairball,digestive,urinary,skin_coat&recipes=poultry&grainFree=1'
          const OUT='qa-artifacts/postdeploy-pr17'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms))

          class Cdp {
            constructor(url){this.url=url;this.ws=null;this.id=1;this.pending=new Map()}
            async connect(){this.ws=new WebSocket(this.url);await new Promise((r,j)=>{const t=setTimeout(()=>j(new Error('ws timeout')),15000);this.ws.addEventListener('open',()=>{clearTimeout(t);r()},{once:true});this.ws.addEventListener('error',()=>j(new Error('ws error')),{once:true})});this.ws.addEventListener('message',e=>{const m=JSON.parse(e.data);if(!m.id)return;const p=this.pending.get(m.id);if(!p)return;this.pending.delete(m.id);m.error?p.j(new Error(m.error.message)):p.r(m.result)});for(const x of ['Page.enable','Runtime.enable','Network.enable'])await this.send(x)}
            send(method,params={}){const id=this.id++;return new Promise((r,j)=>{this.pending.set(id,{r,j});this.ws.send(JSON.stringify({id,method,params}))})}
            async eval(expression){const x=await this.send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(x.exceptionDetails)throw new Error(x.exceptionDetails.exception?.description||x.exceptionDetails.text);return x.result?.value}
            async wait(expression,label,ms=60000){const end=Date.now()+ms;while(Date.now()<end){try{if(await this.eval(`Boolean(${expression})`))return}catch{}await sleep(120)}throw new Error(`timeout ${label}`)}
            async nav(url){await this.send('Page.navigate',{url});await this.wait(`document.readyState==='complete'`,'ready');await this.wait(`document.querySelector('#root')&&document.body.innerText.length>0`,'root')}
            async viewport(w,h){await this.send('Emulation.setDeviceMetricsOverride',{width:w,height:h,deviceScaleFactor:1,mobile:w<800})}
            async shot(path){const data=await this.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});writeFileSync(path,Buffer.from(data.data,'base64'))}
            close(){try{this.ws?.close()}catch{}}
          }

          async function launch(){const bin='/usr/bin/google-chrome';assert.ok(existsSync(bin));const version=execFileSync(bin,['--version'],{encoding:'utf8'}).trim();const port=9960+(process.pid%20),dir=`/tmp/catfood-postdeploy-${process.pid}`;rmSync(dir,{recursive:true,force:true});const proc=spawn(bin,['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu',`--remote-debugging-port=${port}`,`--user-data-dir=${dir}`,'about:blank'],{stdio:'ignore'});for(let i=0;i<220;i++){try{const pages=await(await fetch(`http://127.0.0.1:${port}/json/list`)).json(),p=pages.find(x=>x.type==='page'&&x.webSocketDebuggerUrl);if(p)return{version,proc,dir,c:new Cdp(p.webSocketDebuggerUrl)}}catch{}await sleep(120)}throw new Error('chrome start timeout')}

          const metrics=`(()=>{const rect=n=>{if(!n)return null;const r=n.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};const cards=[...document.querySelectorAll('.research-result-card')];const first=cards[0];const heading=document.querySelector('.research-results-heading');const quick=document.querySelector('.research-quick-view');return{innerWidth,docWidth:document.documentElement.scrollWidth,href:location.href,criteriaText:(document.querySelector('.criteria-bar')?.innerText||'').replace(/\\s+/g,' ').trim(),headingText:(heading?.innerText||'').replace(/\\s+/g,' ').trim(),headingDirection:heading?getComputedStyle(heading).flexDirection:null,relationCount:document.querySelectorAll('.result-relations').length,relationEmptyCount:document.querySelectorAll('.result-relation-empty').length,unfilteredCount:document.querySelectorAll('.research-result-card.is-unfiltered').length,firstProductId:first?.dataset.productId||null,firstCardGrid:first?getComputedStyle(first).gridTemplateColumns:null,firstCard:rect(first),quick:rect(quick),quickHasComparison:[...document.querySelectorAll('.quick-view-section h2')].some(x=>x.textContent?.trim()==='선택한 조건과 비교')}})()`

          async function waitResults(c){await c.wait(`document.querySelector('.research-results-heading')&&document.querySelectorAll('.research-result-card').length>=4`,'results');await c.wait(`document.querySelector('.research-result-image')?.complete`,'image');await sleep(500)}

          const {version,proc,dir,c}=await launch()
          const report={source:'deployed GitHub Pages',deployedSha:DEPLOY_SHA,browserVersion:version,views:{}}
          try {
            await c.connect()

            await c.viewport(390,844)
            await c.nav(PROD+NONE)
            await waitResults(c)
            const none390=await c.eval(metrics)
            assert.equal(none390.docWidth,390,'390 no-condition overflow')
            assert.equal(none390.relationCount,0,'390 no-condition relation remains')
            assert.equal(none390.relationEmptyCount,0,'390 no-condition empty relation remains')
            assert.ok(none390.unfilteredCount>=4,'390 no-condition cards not compact')
            assert.ok(none390.criteriaText.includes('추가 조건 없음'),'top no-condition guidance missing')
            assert.equal(none390.headingDirection,'column','390 Results header not stacked')
            await c.shot(`${OUT}/mobile-390-none-results.png`)

            const firstId=none390.firstProductId
            assert.ok(firstId)
            await c.eval(`document.querySelector('[data-product-id="${firstId}"]')?.click()`)
            await c.wait(`document.querySelector('.research-quick-view')`,'quick view')
            await sleep(250)
            const quick390=await c.eval(metrics)
            assert.equal(quick390.docWidth,390,'390 quick-view overflow')
            assert.equal(quick390.quickHasComparison,false,'empty comparison section remains in quick view')
            await c.shot(`${OUT}/mobile-390-none-quick.png`)

            await c.viewport(390,844)
            await c.nav(PROD+LONG)
            await waitResults(c)
            const long390=await c.eval(metrics)
            assert.equal(long390.docWidth,390,'390 long-condition overflow')
            assert.ok(long390.relationCount+long390.relationEmptyCount>0,'long-condition relation information missing')
            assert.equal(long390.unfilteredCount,0,'long-condition cards incorrectly marked unfiltered')
            assert.equal(long390.headingDirection,'column','390 long-condition Results header not stacked')
            await c.shot(`${OUT}/mobile-390-long-results.png`)

            await c.viewport(1440,1000)
            await c.nav(PROD+NONE)
            await waitResults(c)
            const none1440=await c.eval(metrics)
            assert.equal(none1440.docWidth,1440,'1440 no-condition overflow')
            assert.equal(none1440.relationCount,0,'1440 no-condition relation remains')
            assert.equal(none1440.relationEmptyCount,0,'1440 no-condition empty relation remains')
            assert.equal((none1440.firstCardGrid||'').trim().split(' ').filter(Boolean).length,3,'1440 no-condition relation column remains')
            await c.shot(`${OUT}/desktop-1440-none-results.png`)

            report.views={none390,quick390,long390,none1440}
            writeFileSync(`${OUT}/report.json`,JSON.stringify(report,null,2))
            console.log('POSTDEPLOY_RESULTS_DENSITY PASS')
          } catch(error) {
            report.error=String(error)
            writeFileSync(`${OUT}/report.json`,JSON.stringify(report,null,2))
            throw error
          } finally {
            c.close();proc.kill('SIGTERM');await sleep(200);if(proc.exitCode==null)proc.kill('SIGKILL');rmSync(dir,{recursive:true,force:true})
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-density-pr17-postdeploy
          path: qa-artifacts/postdeploy-pr17/
          if-no-files-found: error
      - name: Preserve QA captures on QA branch
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qa-artifacts/postdeploy-pr17
          git commit -m "qa: preserve PR 17 postdeploy captures"
          git push origin HEAD:qa/results-density-pr17-final-20260910
