name: PR41 postdeploy 360 QA

on:
  push:
    branches:
      - qa/pr41-postdeploy-360-20260916

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    env:
      MERGE_SHA: 484d6d00435ec5c29285c8d9d6184460171183b0
      PAGE_URL: https://osrm.github.io/catfood_web/
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify QA branch preserves deployed product sources
        run: git diff --exit-code "$MERGE_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Run focused Pages browser QA
        run: node .github/pr41-postdeploy-360.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr41-postdeploy-360
          path: qa-artifacts
          if-no-files-found: ignore
