name: PR44 postdeploy 360

on:
  push:
    branches:
      - qa/pr44-postdeploy-360-20260917

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      MERGE_SHA: 8391c76965b8ec94ce25856dad611c7b0f306aac
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard product sources against deployed merge
        run: |
          git fetch origin "$MERGE_SHA" --depth=1
          git diff --exit-code "$MERGE_SHA" -- src tests package.json package-lock.json vite.config.ts tsconfig.json index.html

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Reuse existing browser helper
        run: |
          git fetch origin qa/detail-tab-scroll-position-candidate-20260912 --depth=1
          git show FETCH_HEAD:.github/detail-tab-scroll-qa-helpers.mjs > .github/detail-tab-scroll-qa-helpers.mjs

      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
          /usr/bin/google-chrome --version

      - name: Check deployed Pages at 360x844
        run: node .github/pr44-postdeploy-360.mjs

      - name: Upload postdeploy originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr44-postdeploy-360
          path: qa-artifacts/pr44-postdeploy-360/
          if-no-files-found: warn
