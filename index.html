<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>CATFOOD — 고양이 사료 정보</title>
    <style>
      .startup-panel{box-sizing:border-box;max-width:540px;margin:12vh auto;padding:28px 24px;font-family:system-ui,sans-serif;color:#243d34;line-height:1.7}
      .startup-panel h1{font-size:26px;margin:0 0 20px}.startup-panel p{font-size:16px}.startup-panel a,.startup-panel button{display:inline-block;box-sizing:border-box;margin:0 8px 8px 0;padding:10px 16px;border:1px solid #9cafa6;border-radius:6px;color:inherit;background:#fff;font:inherit;text-decoration:none;min-height:44px;cursor:pointer}.startup-panel button:disabled{cursor:wait;opacity:.65}.startup-panel [hidden]{display:none!important}
    </style>
  </head>
  <body>
    <div id="root"><main class="startup-panel" id="startup-panel" role="status"><h1>CATFOOD</h1><p id="startup-message">화면을 여는 중입니다.</p><button id="startup-retry" type="button" hidden>다시 연결하기</button><a href="">페이지 다시 열기</a><noscript><p>제품을 검색하고 비교하려면 JavaScript를 켜 주세요.</p></noscript></main></div>
    <script>
      (() => {
        const panel = document.getElementById('startup-panel');
        const message = document.getElementById('startup-message');
        const retry = document.getElementById('startup-retry');
        let failedModule = null, resumeApp = null, retryCount = 0, timer;
        const retryStyleSelector = 'link[data-startup-retry-style]';
        function missingStyles() {
          return [...document.querySelectorAll('link[rel="stylesheet"][href]:not([data-startup-retry-style])')]
            .filter(link => {
              if (new URL(link.href).origin !== location.origin) return false;
              // A failed request can leave a sheet whose rules are inaccessible.
              try { return !link.sheet?.cssRules; }
              catch { return true; }
            });
        }
        function finishAttempt() {
          clearTimeout(timer);
          retry.disabled = false;
          panel.removeAttribute('aria-busy');
        }
        function watchSlowStart() {
          clearTimeout(timer);
          timer = setTimeout(() => {
            if (!panel.isConnected) return;
            finishAttempt();
            retry.hidden = !failedModule && !resumeApp;
            message.textContent = '화면을 여는 데 시간이 걸리고 있습니다. 연결을 확인한 뒤 다시 시도해 주세요.';
          }, 12000);
        }
        function showFailure(event) {
          if (!panel.isConnected) return;
          if (event && event.type === 'error' && event.target !== window && !(event.target instanceof HTMLScriptElement && event.target.type === 'module')) return;
          finishAttempt();
          if (event && event.target instanceof HTMLScriptElement && event.target.src) {
            const url = new URL(event.target.src, location.href);
            if (url.origin === location.origin) {
              url.searchParams.delete('_catfood_retry');
              failedModule = url.href;
            }
          }
          retry.hidden = !failedModule && !resumeApp;
          panel.setAttribute('role', 'alert');
          message.textContent = retry.hidden ? '화면을 불러오지 못했습니다. 페이지를 다시 열어 주세요.' : '화면을 불러오지 못했습니다. 선택한 조건과 기록을 유지한 채 다시 연결할 수 있습니다.';
        }
        function finishStyleRetry() {
          if (!resumeApp || document.querySelector(retryStyleSelector)) return;
          if (missingStyles().length) { showFailure(); return; }
          const render = resumeApp;
          resumeApp = null;
          render();
        }
        function retryStartup() {
          if (!panel.isConnected || (!failedModule && !resumeApp) || retry.disabled) return;
          const moduleUrl = failedModule && new URL(failedModule);
          const attempt = Date.now() + '-' + (++retryCount);
          failedModule = null;
          retry.disabled = true;
          panel.setAttribute('role', 'status');
          panel.setAttribute('aria-busy', 'true');
          message.textContent = '다시 연결하고 있습니다. 선택한 조건과 기록은 그대로 유지됩니다.';
          for (const pending of document.querySelectorAll(retryStyleSelector)) {
            pending.onload = pending.onerror = null;
            pending.remove();
          }
          for (const original of missingStyles()) {
            const styleUrl = new URL(original.href);
            styleUrl.searchParams.set('_catfood_retry', attempt);
            const replacement = original.cloneNode();
            replacement.setAttribute('data-startup-retry-style', '');
            replacement.href = styleUrl.href;
            replacement.onload = () => {
              original.remove();
              replacement.removeAttribute('data-startup-retry-style');
              finishStyleRetry();
            };
            replacement.onerror = () => {
              replacement.remove();
              finishStyleRetry();
            };
            document.head.append(replacement);
          }
          if (moduleUrl) {
            moduleUrl.searchParams.set('_catfood_retry', attempt);
            const script = document.createElement('script');
            script.type = 'module'; script.crossOrigin = 'anonymous'; script.src = moduleUrl.href;
            document.head.append(script);
          }
          watchSlowStart();
          finishStyleRetry();
        }
        document.addEventListener('catfood:before-render', (event) => {
          if (!missingStyles().length) return;
          event.preventDefault();
          resumeApp = event.detail;
          finishStyleRetry();
        }, { once: true });
        retry.addEventListener('click', retryStartup);
        watchSlowStart();
        window.addEventListener('error', showFailure, true);
        window.addEventListener('unhandledrejection', showFailure);
        document.addEventListener('catfood:ready', () => {
          clearTimeout(timer);
          window.removeEventListener('error', showFailure, true);
          window.removeEventListener('unhandledrejection', showFailure);
          retry.removeEventListener('click', retryStartup);
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
