name: PR22 Korean browser QA

on:
  push:
    branches:
      - qa/pr22-korean-browser-20260911

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:4174
      VITE_SUPABASE_PUBLISHABLE_KEY: test-key
      VITE_DECISION_INTAKE_ENABLED: 'false'
      SOURCE_SHA: 15a7565decb22ef2514d2a6c6b8647b5fa694aa0
      QA_BASE: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Korean font environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
      - name: Build exact PR candidate without analytics writes
        run: npm run build
      - name: Run representative desktop and mobile SWITCH paths
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pr22-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl -fsS "$QA_BASE" >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS "$QA_BASE" >/dev/null
          node .github/pr22-korean-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr22-korean-browser-qa
          path: qa-artifacts
          if-no-files-found: error
